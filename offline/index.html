<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#23282B">
  <title>Offline — BendBSN</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>(function(){var t=null;try{t=localStorage.getItem('bendbsn_theme')}catch(e){}if(t!=='light'&&t!=='dark')t=(t==null&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';document.documentElement.setAttribute('data-theme',t)})();</script>
  <style>
    /* Self-contained: the service worker serves this page when a page is
       not cached, so it loads nothing but the precached font and favicon.
       Tokens copied from /shared/clinical-ui.css (C High Desert, light + dark). */
    @font-face {
      font-family: 'Bricolage Grotesque';
      font-style: normal;
      font-weight: 200 800;
      font-display: swap;
      src: url('/shared/fonts/bricolage-grotesque-v1-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Bricolage Grotesque Fallback';
      src: local('Arial'), local('ArialMT'), local('Helvetica');
      size-adjust: 103%;
      ascent-override: 90%;
      descent-override: 26%;
      line-gap-override: 0%;
    }
    :root {
      color-scheme: light;
      --clx-font-sans: 'Bricolage Grotesque', 'Bricolage Grotesque Fallback', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      --clx-bg-canvas: #FBFCFC;
      --clx-bg-surface: #FFFFFF;
      --clx-bg-hover: #EEF2EF;
      --clx-quiet: #DDE5D9;
      --clx-quiet-text: #3F4A45;
      --clx-border-field: #76807B;
      --clx-text-primary: #23282B;
      --clx-text-secondary: #3F4A45;
      --clx-accent: #2F6B5F;
      --clx-accent-hover: #26584E;
      --clx-accent-text: #FFFFFF;
      --clx-focus: #3F8A7B;
      --clx-chrome-bg: #23282B;
      --clx-chrome-border: #23282B;
      --clx-chrome-text: #FBFCFC;
      /* The mark on the Basalt bar: same in both themes, as in shared/nav.css */
      --mark-badge: #3F8A7B;
      --mark-sky: #FBFCFC;
      --mark-cross: #E2B33C;
      --type-sm: 13px;
      --type-base: 15px;
      --type-lg: 17px;
      --type-wordmark: 22px;
      --type-h1: 40px;
      --radius: 10px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --clx-bg-canvas: #1A1E20;
        --clx-bg-surface: #23282B;
        --clx-bg-hover: #333A3E;
        --clx-quiet: #29342F;
        --clx-quiet-text: #B9C4BE;
        --clx-border-field: #7F8A85;
        --clx-text-primary: #ECEFED;
        --clx-text-secondary: #B9C4BE;
        --clx-accent: #7CC4B2;
        --clx-accent-hover: #93CCBE;
        --clx-accent-text: #121517;
        --clx-focus: #9FD9CB;
        --clx-chrome-bg: #121517;
        --clx-chrome-border: #3A4346;
        --clx-chrome-text: #ECEFED;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --clx-bg-canvas: #1A1E20;
      --clx-bg-surface: #23282B;
      --clx-bg-hover: #333A3E;
      --clx-quiet: #29342F;
      --clx-quiet-text: #B9C4BE;
      --clx-border-field: #7F8A85;
      --clx-text-primary: #ECEFED;
      --clx-text-secondary: #B9C4BE;
      --clx-accent: #7CC4B2;
      --clx-accent-hover: #93CCBE;
      --clx-accent-text: #121517;
      --clx-focus: #9FD9CB;
      --clx-chrome-bg: #121517;
      --clx-chrome-border: #3A4346;
      --clx-chrome-text: #ECEFED;
    }
    @media (max-width: 700px) {
      :root { --type-h1: 28px; --type-wordmark: 20px; }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--clx-bg-canvas);
      color: var(--clx-text-primary);
      font-family: var(--clx-font-sans);
      font-size: var(--type-base);
      line-height: 1.5;
    }
    :focus-visible { outline: 3px solid var(--clx-focus); outline-offset: 2px; }

    /* Basalt top bar, as on every other page */
    .bar {
      display: flex;
      align-items: center;
      min-height: 56px;
      padding: 0 24px;
      padding-top: env(safe-area-inset-top, 0px);
      background: var(--clx-chrome-bg);
      border-bottom: 1px solid var(--clx-chrome-border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      border-radius: 8px;
      color: var(--clx-chrome-text);
      text-decoration: none;
    }
    .brand-mark { width: 30px; height: 30px; flex: none; }
    .mk-badge { fill: var(--mark-badge); }
    .mk-sky { fill: none; stroke: var(--mark-sky); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .mk-cross { fill: var(--mark-cross); }
    .wordmark {
      font-size: var(--type-wordmark);
      font-weight: 700;
      font-variation-settings: 'opsz' 96;
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .vh {
      position: absolute;
      width: 1px; height: 1px;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px 64px;
    }
    .wrap { width: 100%; max-width: 440px; }
    .signal {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 56px; height: 56px;
      margin-bottom: 24px;
      border-radius: 50%;
      background: var(--clx-quiet);
      color: var(--clx-quiet-text);
    }
    .signal svg {
      width: 28px; height: 28px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      margin-bottom: 12px;
      font-size: var(--type-h1);
      font-weight: 700;
      font-variation-settings: 'opsz' 96;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    .lede {
      margin-bottom: 32px;
      font-size: var(--type-lg);
      color: var(--clx-text-secondary);
    }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 24px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      font: inherit;
      font-size: var(--type-base);
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .btn-primary { background: var(--clx-accent); border-color: var(--clx-accent); color: var(--clx-accent-text); }
    .btn-primary:hover { background: var(--clx-accent-hover); border-color: var(--clx-accent-hover); }
    .btn-secondary { background: var(--clx-bg-surface); border-color: var(--clx-border-field); color: var(--clx-text-primary); }
    .btn-secondary:hover { background: var(--clx-bg-hover); }

    @media (max-width: 600px) {
      .bar { min-height: 52px; padding: 0 16px; padding-top: env(safe-area-inset-top, 0px); }
      .brand-mark { width: 28px; height: 28px; }
      main { align-items: flex-start; padding: 40px 16px 48px; }
      .actions { flex-direction: column; }
      .btn { width: 100%; min-height: 48px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
    }
    @media (forced-colors: active) {
      :focus-visible { outline-color: Highlight; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <a class="brand" href="/home/">
      <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><circle class="mk-badge" cx="24" cy="24" r="22"/><path class="mk-sky" d="M6 33 L13 26 L17 29 L24 17 L30 26 L34 22 L42 33"/><rect class="mk-cross" x="32.5" y="8" width="4" height="10" rx="1"/><rect class="mk-cross" x="29.5" y="11" width="10" height="4" rx="1"/></svg>
      <span class="wordmark">BendBSN</span><span class="vh"> home</span>
    </a>
  </header>
  <main>
    <div class="wrap">
      <div class="signal" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 5.17-2.69"/><path d="M19 12.859a10 10 0 0 0-2.007-1.523"/><path d="M2 8.82a15 15 0 0 1 4.177-2.643"/><path d="M22 8.82a15 15 0 0 0-11.288-3.764"/><path d="m2 2 20 20"/></svg></div>
      <h1>You're offline</h1>
      <p class="lede">This page needs a connection. Pages saved on this device, like Home and RN Notes, can still open.</p>
      <div class="actions">
        <button type="button" class="btn btn-primary" onclick="location.reload()">Try again</button>
        <a class="btn btn-secondary" href="/home/">Go to Home</a>
      </div>
    </div>
  </main>
</body>
</html>
