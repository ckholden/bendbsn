<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d1f2d">
  <title>Offline — BendBSN</title>
  <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('bendbsn_theme')||'light');}catch(e){}</script>
  <style>
    /* Tokens copied from /shared/clinical-ui.css (light + dark) so this page stays standalone */
    :root {
      --clx-bg-canvas: #e8edf2;
      --clx-bg-surface: #ffffff;
      --clx-border: #d1dce8;
      --clx-text-primary: #1a2532;
      --clx-text-secondary: #4a5568;
      --clx-text-muted: #718096;
      --clx-accent: #0f7490;
      --clx-accent-text: #ffffff;
      --clx-shadow-lg: 0 4px 8px rgba(0,0,0,0.10), 0 8px 24px rgba(0,0,0,0.10);
    }
    [data-theme="dark"] {
      --clx-bg-canvas: #0d1117;
      --clx-bg-surface: #161b22;
      --clx-border: #2d3a4a;
      --clx-text-primary: #e2e8f0;
      --clx-text-secondary: #94a3b8;
      --clx-text-muted: #64748b;
      --clx-accent: #22a8c4;
      --clx-shadow-lg: 0 4px 8px rgba(0,0,0,0.28), 0 8px 24px rgba(0,0,0,0.28);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      background: var(--clx-bg-canvas);
      color: var(--clx-text-primary);
      text-align: center;
      padding: 24px;
    }
    .card {
      background: var(--clx-bg-surface);
      border: 1px solid var(--clx-border);
      border-radius: 12px;
      padding: 40px 32px;
      max-width: 380px;
      width: 100%;
      box-shadow: var(--clx-shadow-lg);
    }
    .icon {
      font-size: 48px;
      margin-bottom: 16px;
      display: block;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--clx-text-primary);
    }
    p {
      color: var(--clx-text-secondary);
      font-size: 15px;
      line-height: 1.55;
      margin-bottom: 28px;
    }
    button {
      background: var(--clx-accent);
      color: var(--clx-accent-text);
      border: none;
      padding: 13px 32px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.88; }
    button:active { opacity: 0.78; }
    .home-link {
      display: inline-block;
      margin-top: 14px;
      font-size: 14px;
      font-weight: 600;
      color: var(--clx-accent);
      text-decoration: none;
    }
    .home-link:hover { text-decoration: underline; }
    .note {
      margin-top: 16px;
      font-size: 12px;
      color: var(--clx-text-muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon">📡</span>
    <h1>You're offline</h1>
    <p>BendBSN needs a connection to load. Check your network and try again.</p>
    <button onclick="location.reload()">Try Again</button>
    <a class="home-link" href="/home/">Go to Home</a>
    <p class="note">Your saved notes will be available once you reconnect.</p>
  </div>
</body>
</html>
