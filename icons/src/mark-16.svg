<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="16" height="16" role="img" aria-label="BendBSN">
  <!-- 16 px optical variant of mark.svg: bigger disc, the canonical
       skyline simplified to its three peaks at a heavier stroke, and a
       heavier cross, so it still reads at 16 px. The skyline is clipped
       to the disc so its round caps never poke past the edge. -->
  <defs><clipPath id="m16-disc"><circle cx="24" cy="24" r="23"/></clipPath></defs>
  <circle cx="24" cy="24" r="23" fill="#2F6B5F"/>
  <path clip-path="url(#m16-disc)" d="M6 36 L16 25 L22 31 L29 21 L42 36" fill="none" stroke="#FBFCFC" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="30" y="5" width="6" height="14" rx="1" fill="#E2B33C"/>
  <rect x="26" y="9" width="14" height="6" rx="1" fill="#E2B33C"/>
</svg>
