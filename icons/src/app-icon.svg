<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- App icon tile (decision 7: Juniper, full bleed). The "On Juniper"
       mark: Snow disc, Juniper skyline, Rabbitbrush cross, drawn from
       mark.svg's canonical path (48-unit box, scaled 8.6x and centred).
       Disc radius 189.2 = 74% of the tile, inside the maskable safe zone
       (the central circle of radius 204.8, 80% of the tile), so any
       launcher mask keeps the whole mark. Opaque, so the same art serves
       maskable icons and apple-touch-icon; generate-assets.js rounds the
       corners for the purpose "any" icons. -->
  <rect width="512" height="512" fill="#2F6B5F"/>
  <g transform="translate(49.6 49.6) scale(8.6)">
    <circle cx="24" cy="24" r="22" fill="#FBFCFC"/>
    <path d="M6 33 L13 26 L17 29 L24 17 L30 26 L34 22 L42 33" fill="none" stroke="#2F6B5F" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="33" y="8" width="3" height="10" rx="1" fill="#E2B33C"/>
    <rect x="29.5" y="11.5" width="10" height="3" rx="1" fill="#E2B33C"/>
  </g>
</svg>
