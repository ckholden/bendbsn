<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="32" height="32">
  <!-- Browser tab icon. Tabs draw favicons at 16 CSS px, so this is the
       16 px optical variant (mark-16.svg). The Juniper disc is only
       1.95:1 against a dark tab strip, so dark tabs get a 1 px Snow ring
       (3 units of 48 = 1 px at 16 px). If a renderer ignores the style
       block the ring shows on light tabs too, white on white. -->
  <style>
    .ring { display: none; }
    @media (prefers-color-scheme: dark) { .ring { display: inline; } }
  </style>
  <defs><clipPath id="fav-disc"><circle cx="24" cy="24" r="23"/></clipPath></defs>
  <circle cx="24" cy="24" r="23" fill="#2F6B5F"/>
  <circle class="ring" cx="24" cy="24" r="22.5" fill="none" stroke="#FBFCFC" stroke-width="3"/>
  <path clip-path="url(#fav-disc)" d="M6 36 L16 25 L22 31 L29 21 L42 36" fill="none" stroke="#FBFCFC" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="30" y="5" width="6" height="14" rx="1" fill="#E2B33C"/>
  <rect x="26" y="9" width="14" height="6" rx="1" fill="#E2B33C"/>
</svg>
