<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>if(location.protocol!=='https:'&&location.hostname!=='localhost'){location.replace('https:'+location.href.substring(location.protocol.length));}</script>
    <script>if(localStorage.getItem('bendbsn_auth')!=='true'){window.location.href='/';}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0d1f2d">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/logo-mark.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/shared/header.css">
    <link rel="stylesheet" href="/shared/toast.css">
    <link rel="stylesheet" href="/shared/clinical-ui.css">
    <link rel="stylesheet" href="/shared/app-shell.css">
    <title>Clinical Packet — BendBSN</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh; min-height: 100dvh;
            display: flex; flex-direction: column;
            background: var(--clx-bg-canvas, #f0f4f8);
            color: var(--clx-text-primary, #1a3a5c);
        }

        /* Sticky wrapper for the editor head + tab bar. The site header is not
           pinned, so the pair sticks to the viewport top as one block — no
           height math, and it still works when the head wraps on narrow screens. */
        .cap-sticky {
            position: sticky;
            top: 0;
            z-index: 50;
        }

        /* Editor head — packet title + status + module toggle */
        .cap-editor-head {
            background: var(--clx-bg-surface, #fff);
            border-bottom: 1px solid var(--clx-border, #d1dce8);
            padding: 10px 20px;
            display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
        }
        .cap-back {
            font-size: 12.5px;
            color: var(--clx-text-secondary, #4a5568);
            text-decoration: none;
            padding: 4px 10px;
            border-radius: 5px;
            border: 1px solid var(--clx-border, #d1dce8);
            background: var(--clx-bg-surface-2, #f7f9fc);
        }
        .cap-back:hover { background: var(--clx-bg-hover, #e6edf5); }

        .cap-title-input {
            flex: 1; min-width: 200px;
            font: inherit; font-size: 16px; font-weight: 700;
            color: var(--clx-text-primary, #1a3a5c);
            background: transparent;
            border: 1px solid transparent;
            border-radius: 6px;
            padding: 4px 8px;
        }
        .cap-title-input:hover { border-color: var(--clx-border, #d1dce8); }
        .cap-title-input:focus {
            outline: none;
            border-color: var(--clx-accent, #0f7490);
            box-shadow: 0 0 0 3px rgba(var(--clx-accent-rgb, 15, 116, 144), 0.12);
            background: var(--clx-bg-surface, #fff);
        }

        .cap-save-status {
            font-size: 12px;
            padding: 3px 9px;
            border-radius: 999px;
            background: var(--clx-success-bg, #dcfce7); color: var(--clx-success-text, #166534);
            border: 1px solid #bbf7d0;
            white-space: nowrap;
        }
        .cap-save-status.saving { background: var(--clx-warning-bg, #fef9c3); color: var(--clx-warning-text, #854d0e); border-color: #fde68a; }
        .cap-save-status.offline { background: var(--clx-danger-bg, #fee2e2); color: var(--clx-danger-text, #991b1b); border-color: #fecaca; }

        .cap-modules-btn {
            padding: 6px 12px;
            border-radius: 6px;
            font-family: inherit; font-size: 12.5px; font-weight: 600;
            border: 1px solid var(--clx-border, #d1dce8);
            background: var(--clx-bg-surface, #fff);
            color: var(--clx-text-primary, #1a3a5c);
            cursor: pointer;
        }
        .cap-modules-btn:hover { background: var(--clx-bg-hover, #e6edf5); }

        /* Tab bar */
        .cap-tabs {
            background: var(--clx-bg-surface, #fff);
            border-bottom: 1px solid var(--clx-border, #d1dce8);
            padding: 0 20px;
            display: flex; gap: 2px;
            overflow-x: auto;
            white-space: nowrap;
        }
        .cap-tab {
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            padding: 10px 14px;
            font: inherit; font-size: 13px; font-weight: 500;
            color: var(--clx-text-secondary, #4a5568);
            cursor: pointer;
            display: inline-flex; align-items: center; gap: 6px;
            white-space: nowrap;
        }
        .cap-tab:hover { color: var(--clx-text-primary, #1a3a5c); }
        .cap-tab.active {
            color: var(--clx-accent, #0f7490);
            border-bottom-color: var(--clx-accent, #0f7490);
            font-weight: 600;
        }
        .cap-tab-icon { font-size: 14px; }

        /* Tab content */
        .cap-content {
            max-width: 1080px;
            margin: 0 auto;
            padding: 22px 20px 80px;
            width: 100%;
            flex: 1;
        }
        .cap-tab-empty {
            background: var(--clx-bg-surface, #fff);
            border: 1px dashed var(--clx-border, #d1dce8);
            border-radius: 8px;
            padding: 36px 22px;
            text-align: center;
            color: var(--clx-text-muted, #718096);
            font-size: 13px;
            line-height: 1.6;
        }
        .cap-tab-empty strong { color: var(--clx-text-primary, #1a3a5c); display: block; margin-bottom: 6px; font-size: 14px; }

        /* Module toggle drawer (slide-over from right) */
        .cap-drawer-backdrop {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.32);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        .cap-drawer-backdrop.visible { opacity: 1; pointer-events: auto; }
        .cap-drawer {
            position: fixed;
            top: 0; right: 0; bottom: 0;
            width: min(380px, 90vw);
            background: var(--clx-bg-surface, #fff);
            box-shadow: -4px 0 24px rgba(0,0,0,0.15);
            z-index: 101;
            transform: translateX(100%);
            transition: transform 0.2s;
            display: flex; flex-direction: column;
        }
        .cap-drawer.visible { transform: translateX(0); }
        .cap-drawer-head {
            padding: 14px 18px;
            border-bottom: 1px solid var(--clx-border, #d1dce8);
            display: flex; align-items: center; gap: 10px;
        }
        .cap-drawer-head h3 {
            font-size: 15px; font-weight: 700;
            color: var(--clx-text-primary, #1a3a5c);
            margin: 0;
            flex: 1;
        }
        .cap-drawer-close {
            background: none; border: none;
            font-size: 22px; line-height: 1;
            color: var(--clx-text-muted, #718096);
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 4px;
        }
        .cap-drawer-close:hover { background: rgba(0,0,0,0.05); color: var(--clx-text-primary, #1a3a5c); }
        .cap-drawer-body {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }
        .cap-drawer-cat {
            font-size: 10.5px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.04em;
            color: var(--clx-text-muted, #718096);
            padding: 12px 18px 4px;
        }
        /* One row per module: the on/off toggle (a <label>), then — for an
           enabled module — its "In PDF" select on a line of its own, outside
           the label so using it never toggles the checkbox. */
        .cap-drawer-row {
            display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
            padding: 8px 18px;
        }
        .cap-drawer-row:hover { background: var(--clx-bg-hover, #f7fafd); }
        .cap-drawer-toggle {
            flex: 1 1 100%; min-width: 0; margin: 0;
            display: flex; align-items: center; gap: 10px;
            cursor: pointer;
        }
        .cap-drawer-toggle.static { cursor: default; }
        .cap-drawer-row input[type="checkbox"] {
            width: 16px; height: 16px; accent-color: var(--clx-accent, #0f7490);
            cursor: pointer; flex: none; margin: 0;
        }
        .cap-drawer-row.locked .cap-drawer-toggle { opacity: 0.7; }
        .cap-drawer-row.locked input[type="checkbox"] { cursor: not-allowed; }
        .cap-drawer-row .icon { font-size: 16px; width: 22px; text-align: center; flex: none; }
        .cap-drawer-row .label { flex: 1; min-width: 0; font-size: 13px; color: var(--clx-text-primary, #1a3a5c); overflow-wrap: anywhere; }
        .cap-drawer-print {
            flex: 1 1 100%; min-width: 0;
            display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px;
            padding-left: 58px; /* checkbox + icon: lines up with the module name */
        }
        .cap-drawer-page .cap-drawer-print { padding-left: 32px; }
        .cap-print-lbl {
            flex: none;
            font-size: 10.5px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.04em;
            color: var(--clx-text-muted, #718096);
        }
        /* Compact: beats clinical-ui's global select/input padding + size */
        .cap-drawer select.cap-print-mode {
            flex: 0 1 auto; min-width: 0; max-width: 100%;
            margin: 0;
            font-family: inherit;
            font-size: 12.5px !important;
            padding: 3px 8px !important;
            border-radius: 5px !important;
            cursor: pointer;
        }
        .cap-drawer select.cap-print-mode[data-mode="na"] { color: var(--clx-warning-text, #92400e) !important; }
        .cap-drawer select.cap-print-mode[data-mode="omit"] { color: var(--clx-text-secondary, #4a5568) !important; }
        .cap-drawer input.cap-print-reason {
            flex: 1 1 100%; min-width: 0; margin: 0;
            font-size: 12.5px !important;
            padding: 5px 8px !important;
        }
        .cap-drawer input.cap-print-reason[hidden] { display: none; }
        /* Course profile line at the top of the drawer */
        .cap-drawer-profile {
            margin: 10px 18px 6px;
            padding: 10px 12px;
            border: 1px solid var(--clx-border, #d1dce8);
            border-radius: 6px;
            background: var(--clx-bg-surface-2, #f7f9fc);
        }
        .cap-drawer-profile-text { font-size: 13px; color: var(--clx-text-primary, #1a3a5c); overflow-wrap: anywhere; }
        .cap-drawer-profile-sub {
            font-size: 11.5px; line-height: 1.45;
            color: var(--clx-text-muted, #718096);
            margin: 4px 0 8px;
        }
        .cap-drawer-row .lock-tag {
            font-size: 9.5px; text-transform: uppercase;
            color: var(--clx-text-muted, #718096);
            border: 1px solid var(--clx-border, #d1dce8);
            padding: 1px 5px;
            border-radius: 4px;
        }
        .cap-drawer-foot {
            border-top: 1px solid var(--clx-border, #d1dce8);
            padding: 10px 18px;
            font-size: 11.5px;
            color: var(--clx-text-muted, #718096);
        }

        /* One-time course-profile offer, above the tab content */
        .cap-offer-slot {
            width: 100%; max-width: 1080px;
            margin: 0 auto;
            padding: 16px 20px 0;
        }
        .cap-offer-slot:empty { padding: 0; }
        .cap-offer {
            display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
            padding: 12px 14px;
            border: 1px solid var(--clx-border, #d1dce8);
            border-left: 3px solid var(--clx-accent, #0f7490);
            border-radius: 8px;
            background: var(--clx-bg-surface, #fff);
        }
        .cap-offer-text {
            flex: 1 1 280px; min-width: 0;
            margin: 0;
            font-size: 13px; line-height: 1.5;
            color: var(--clx-text-secondary, #4a5568);
        }
        .cap-offer-text strong { color: var(--clx-text-primary, #1a3a5c); }
        .cap-offer-actions { display: flex; flex-wrap: wrap; gap: 8px; }

        /* Pre-submit check (course-profile packets): head button with a
           must-fix count, and a drawer built on the Modules drawer. Status
           is always spelled out (pill text, group headings) — colour is
           only a second cue. */
        .cap-check-btn { display: inline-flex; align-items: center; gap: 6px; }
        .cap-check-btn[hidden], .cap-check-badge[hidden] { display: none !important; }
        .cap-check-badge {
            min-width: 18px; padding: 0 6px; box-sizing: border-box;
            border-radius: 999px; text-align: center;
            font-size: 11px; font-weight: 700; line-height: 18px;
            font-variant-numeric: tabular-nums;
            background: var(--clx-danger-bg, #fef2f2); color: var(--clx-danger-text, #991b1b);
            border: 1px solid var(--clx-danger, #dc2626);
        }
        .cap-sr {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
        }
        /* Out of the tab order and the accessibility tree while closed */
        .cap-drawer.cap-check-drawer {
            width: min(460px, 94vw);
            visibility: hidden;
            transition: transform 0.2s, visibility 0s linear 0.2s;
        }
        .cap-drawer.cap-check-drawer.visible { visibility: visible; transition: transform 0.2s; }
        .cap-check-drawer:focus { outline: none; }
        .cap-check-gate {
            margin: 12px 18px 0; padding: 10px 12px;
            border: 1px solid var(--clx-danger, #dc2626); border-left-width: 3px; border-radius: 6px;
            background: var(--clx-danger-bg, #fef2f2); color: var(--clx-danger-text, #991b1b);
            font-size: 13px; line-height: 1.45;
        }
        .cap-check-gate[hidden] { display: none; }
        .cap-check-gate strong { display: block; }
        .cap-check-gate p { margin: 2px 0 0; }
        .cap-check-gate .cap-link-btn { color: inherit; font-weight: 600; }
        .cap-check-summary {
            margin: 0; padding: 10px 18px;
            border-bottom: 1px solid var(--clx-border, #d1dce8);
            font-size: 13px; font-weight: 600; line-height: 1.45;
            color: var(--clx-text-primary, #1a3a5c);
            font-variant-numeric: tabular-nums;
        }
        .cap-check-h { margin: 0; }
        .cap-check-rows, .cap-check-notes, .cap-check-issues { list-style: none; margin: 0; padding: 0; }
        .cap-check-row { padding: 8px 18px; }
        .cap-check-row + .cap-check-row { border-top: 1px solid var(--clx-border, #e2e8f0); }
        .cap-check-rowhead { display: flex; align-items: baseline; gap: 8px; }
        .cap-check-n {
            flex: none; width: 18px; text-align: right;
            font-size: 12px; font-weight: 700; color: var(--clx-text-muted, #718096);
            font-variant-numeric: tabular-nums;
        }
        .cap-check-rowlabel {
            flex: 1; min-width: 0;
            font-size: 13px; color: var(--clx-text-primary, #1a3a5c);
            overflow-wrap: anywhere;
        }
        .cap-check-pts {
            flex: none; white-space: nowrap;
            font-size: 11.5px; color: var(--clx-text-muted, #718096);
            font-variant-numeric: tabular-nums;
        }
        .cap-check-pill {
            flex: none; align-self: center; white-space: nowrap;
            font-size: 11px; font-weight: 600; line-height: 1.6;
            padding: 0 8px; border-radius: 999px; border: 1px solid transparent;
        }
        .cap-check-pill[data-status="complete"] { background: var(--clx-success-bg, #ecfdf5); color: var(--clx-success-text, #065f46); border-color: var(--clx-success, #059669); }
        .cap-check-pill[data-status="partial"]  { background: var(--clx-warning-bg, #fffbeb); color: var(--clx-warning-text, #92400e); border-color: var(--clx-warning, #d97706); }
        .cap-check-pill[data-status="missing"]  { background: var(--clx-danger-bg, #fef2f2); color: var(--clx-danger-text, #991b1b); border-color: var(--clx-danger, #dc2626); }
        .cap-check-pill[data-status="na"] {
            background: var(--clx-bg-surface-2, #f7f9fc); color: var(--clx-text-secondary, #4a5568);
            border-color: var(--clx-border, #d1dce8);
        }
        .cap-check-notes { margin: 4px 0 0 26px; }
        .cap-check-notes li {
            padding: 2px 0;
            font-size: 12px; line-height: 1.5;
            color: var(--clx-text-secondary, #4a5568);
            overflow-wrap: anywhere;
        }
        .cap-check-notes .cap-link-btn { margin-left: 6px; font-size: 12px; white-space: nowrap; }
        .cap-check-issues { padding: 2px 18px 6px; }
        .cap-check-issue {
            display: flex; flex-wrap: wrap; align-items: flex-start; gap: 6px 10px;
            margin-top: 6px; padding: 8px 10px;
            border: 1px solid var(--clx-border, #d1dce8);
            border-left: 3px solid var(--clx-info, #0284c7);
            border-radius: 6px;
            background: var(--clx-bg-surface, #fff);
        }
        .cap-check-issue[data-sev="block"] { border-left-color: var(--clx-danger, #dc2626); }
        .cap-check-issue[data-sev="warn"] { border-left-color: var(--clx-warning, #d97706); }
        .cap-check-ibody { flex: 1 1 200px; min-width: 0; }
        .cap-check-itext {
            margin: 0;
            font-size: 12.5px; line-height: 1.5;
            color: var(--clx-text-primary, #1a3a5c);
            overflow-wrap: anywhere;
        }
        .cap-check-isub, .cap-check-excerpt {
            margin: 3px 0 0;
            font-size: 12px; line-height: 1.5;
            color: var(--clx-text-secondary, #4a5568);
            overflow-wrap: anywhere;
        }
        .cap-check-excerpt { font-style: italic; }
        .cap-check-issue .cap-btn-sm { flex: none; }
        .cap-check-empty {
            margin: 0; padding: 6px 18px 10px;
            font-size: 12.5px; color: var(--clx-text-muted, #718096);
        }
        .cap-check-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
        .cap-check-label { flex: 1 1 200px; min-width: 0; margin: 0; line-height: 1.45; }
        .cap-check-foot .cap-btn-sm { flex: none; }

        /* ────────── Renderer-shared UI ────────── */
        .cap-panel {
            background: var(--clx-bg-surface, #fff);
            border: 1px solid var(--clx-border, #d1dce8);
            border-radius: 8px;
            margin-bottom: 16px;
            overflow: hidden;
        }
        .cap-panel-head {
            padding: 12px 16px;
            background: var(--clx-bg-surface-2, #f7f9fc);
            border-bottom: 1px solid var(--clx-border, #d1dce8);
        }
        .cap-panel-head h3 {
            margin: 0; font-size: 15px; font-weight: 700;
            color: var(--clx-text-primary, #1a3a5c);
        }
        .cap-panel-body { padding: 16px; }
        .cap-hint {
            font-size: 12px; color: var(--clx-text-muted, #718096);
            margin: 0 0 12px;
        }
        .cap-fineprint {
            font-size: 11px; color: var(--clx-text-muted, #718096);
            margin: 6px 0 0;
        }
        .cap-subhead {
            font-size: 14px; font-weight: 700;
            color: var(--clx-accent, #0f7490);
            margin: 18px 0 8px;
        }
        .cap-grid { display: grid; gap: 10px; margin-bottom: 10px; }
        .cap-grid.g2 { grid-template-columns: repeat(2, 1fr); }
        .cap-grid.g3 { grid-template-columns: repeat(3, 1fr); }
        .cap-grid.g4 { grid-template-columns: repeat(4, 1fr); }
        .cap-grid.g5 { grid-template-columns: repeat(5, 1fr); }
        @media (max-width: 800px) {
            .cap-grid.g4, .cap-grid.g5 { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 480px) {
            .cap-grid.g2, .cap-grid.g3, .cap-grid.g4, .cap-grid.g5 { grid-template-columns: 1fr; }
        }
        /* Vitals (BP/HR/RR/Temp/SpO2): wrap onto more lines rather than squeeze
           each box below the width of a normal value like "120/80" or "98.6" */
        .cap-grid.cap-vitals { grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); }
        .cap-field { display: flex; flex-direction: column; }
        .cap-label {
            font-size: 11px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.04em;
            color: var(--clx-text-secondary, #4a5568);
            margin-bottom: 4px;
        }
        .cap-tf {
            width: 100%; box-sizing: border-box;
            font: inherit; font-size: 13px;
            padding: 7px 9px;
            border: 1px solid var(--clx-border, #d1dce8); border-radius: 5px;
            background: var(--clx-bg-surface, #fff);
            color: var(--clx-text-primary, #1a3a5c);
            resize: vertical;
        }
        .cap-tf:focus {
            outline: none; border-color: var(--clx-accent, #0f7490);
            box-shadow: 0 0 0 2px rgba(var(--clx-accent-rgb, 15, 116, 144), 0.12);
        }

        /* Score block */
        .cap-score-block {
            background: var(--clx-bg-surface-2, #f7f9fc);
            border: 1px solid var(--clx-border, #d1dce8);
            border-radius: 6px;
            padding: 12px 16px;
            margin: 14px 0 0;
            display: flex; align-items: center; gap: 14px;
        }
        .cap-score-num { font-size: 26px; font-weight: 800; color: var(--clx-accent, #0f7490); line-height: 1; }
        .cap-score-label { font-size: 13px; color: var(--clx-text-secondary, #4a5568); font-weight: 600; }
        .cap-score-risk { margin-left: auto; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--clx-bg-surface-3, rgba(0,0,0,0.04)); }
        .cap-score-block.high .cap-score-risk { background: var(--clx-danger-bg, #fee2e2); color: var(--clx-danger-text, #991b1b); }
        .cap-score-block.moderate .cap-score-risk { background: var(--clx-warning-bg, #fef3c7); color: var(--clx-warning-text, #854d0e); }
        .cap-score-block.low .cap-score-risk { background: var(--clx-success-bg, #dcfce7); color: var(--clx-success-text, #166534); }

        /* OMEGA table */
        .cap-omega-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .cap-omega-table td { padding: 8px; border: 1px solid var(--clx-border, #d1dce8); vertical-align: top; }
        .cap-omega-key { width: 50px; text-align: center; background: var(--clx-bg-surface-2, #f7f9fc); }
        .cap-omega-letter {
            display: inline-block; width: 30px; height: 30px; line-height: 30px;
            background: var(--clx-accent, #0f7490); color: #fff;
            border-radius: 50%; font-weight: 800; font-size: 13px;
        }
        .cap-omega-label { width: 110px; font-weight: 600; color: var(--clx-text-primary, #1a3a5c); }
        .cap-omega-table textarea { border: none; padding: 4px; resize: vertical; min-height: 32px; background: transparent; }

        /* Medications table */
        .cap-meds-wrap { overflow-x: auto; }
        .cap-meds-table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 700px; }
        .cap-meds-table th, .cap-meds-table td {
            padding: 6px; border: 1px solid var(--clx-border, #d1dce8); vertical-align: top;
        }
        .cap-meds-table th {
            background: var(--clx-bg-surface-2, #f7f9fc); font-weight: 700;
            color: var(--clx-accent, #0f7490); font-size: 11.5px;
            text-align: left;
        }
        .cap-meds-table th small { font-weight: 400; color: var(--clx-text-secondary, #4a5568); display: block; margin-top: 2px; }
        .cap-meds-table textarea { border: none; padding: 4px; resize: vertical; min-height: 36px; font-size: 12px; background: transparent; width: 100%; box-sizing: border-box; }
        .cap-meds-del { width: 36px; text-align: center; }
        .cap-row-del {
            background: none; border: none; font-size: 18px; line-height: 1;
            color: var(--clx-danger, #b91c1c); cursor: pointer; padding: 4px 8px; border-radius: 4px;
        }
        .cap-row-del:hover { background: var(--clx-danger-bg, #fbebeb); }
        .cap-add-row {
            margin-top: 12px; padding: 7px 14px;
            background: var(--clx-accent, #0f7490); color: #fff;
            border: none; border-radius: 5px;
            font-size: 12.5px; font-weight: 600; cursor: pointer;
        }
        .cap-add-row:hover { filter: brightness(1.1); }

        /* Morse */
        .cap-morse-var { margin-bottom: 14px; }
        .cap-morse-var h4 { font-size: 13px; font-weight: 700; color: var(--clx-text-primary, #1a3a5c); margin: 0 0 6px; }
        .cap-morse-opts { display: flex; flex-direction: column; gap: 4px; }
        .cap-morse-opt {
            display: flex; align-items: center; gap: 10px;
            padding: 6px 10px; border: 1px solid var(--clx-border, #d1dce8); border-radius: 5px;
            cursor: pointer; font-size: 13px;
            background: var(--clx-bg-surface, #fff);
        }
        .cap-morse-opt:hover { background: var(--clx-bg-hover, #f7fafd); }
        .cap-morse-opt.selected {
            border-color: var(--clx-accent, #0f7490);
            background: rgba(var(--clx-accent-rgb, 15, 116, 144), 0.06);
        }
        .cap-morse-opt input { accent-color: var(--clx-accent, #0f7490); }
        .cap-morse-opt span:nth-child(2) { flex: 1; }
        .cap-morse-pts {
            background: var(--clx-accent, #0f7490); color: #fff;
            padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700;
        }

        /* Braden */
        .cap-braden-factor { margin-bottom: 14px; padding: 12px; border: 1px solid var(--clx-border, #d1dce8); border-radius: 6px; background: var(--clx-bg-surface-2, #f7f9fc); }
        .cap-braden-factor h4 { font-size: 14px; color: var(--clx-accent, #0f7490); margin: 0 0 4px; }
        .cap-braden-defn { font-size: 11.5px; color: var(--clx-text-muted, #718096); font-style: italic; margin: 0 0 10px; }
        .cap-braden-opts { display: grid; gap: 8px; }
        .cap-braden-opts.cols-3 { grid-template-columns: repeat(3, 1fr); }
        .cap-braden-opts.cols-4 { grid-template-columns: repeat(4, 1fr); }
        @media (max-width: 800px) {
            .cap-braden-opts.cols-3, .cap-braden-opts.cols-4 { grid-template-columns: 1fr; }
        }
        .cap-braden-opt {
            display: flex; flex-direction: column;
            padding: 8px 10px; border: 1px solid var(--clx-border, #d1dce8); border-radius: 5px;
            cursor: pointer; background: var(--clx-bg-surface, #fff);
            font-size: 11.5px; line-height: 1.4;
        }
        .cap-braden-opt:hover { border-color: var(--clx-accent, #0f7490); }
        .cap-braden-opt.selected {
            border: 2px solid var(--clx-accent, #0f7490);
            background: rgba(var(--clx-accent-rgb, 15, 116, 144), 0.06);
            padding: 7px 9px;
        }
        .cap-braden-opt input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
        .cap-braden-opt strong { color: var(--clx-accent, #0f7490); display: block; margin-bottom: 4px; font-size: 12px; }
        .cap-braden-desc { color: var(--clx-text-secondary, #4a5568); }

        /* Mini-Cog */
        .cap-careplan-box {
            border: 1px solid var(--clx-border, #d1dce8);
            border-radius: 6px;
            padding: 14px;
            margin-bottom: 12px;
            background: var(--clx-bg-surface-2, #f7f9fc);
        }
        .cap-careplan-box h4 { margin: 0 0 4px; font-size: 14px; color: var(--clx-accent, #0f7490); }
        .cap-careplan-box p { font-size: 13px; margin: 4px 0 0; color: var(--clx-text-secondary, #4a5568); }
        .cap-clock-wrap { background: #fff; padding: 10px; border-radius: 6px; border: 1px solid var(--clx-border, #d1dce8); }
        .cap-btn-sm {
            padding: 5px 10px; font: inherit; font-size: 12px;
            border: 1px solid var(--clx-border, #d1dce8); border-radius: 4px;
            background: var(--clx-bg-surface, #fff); color: var(--clx-text-primary, #1a3a5c);
            cursor: pointer;
        }
        .cap-btn-sm:hover { background: var(--clx-bg-hover, #e6edf5); }
        .cap-btn-sm.primary {
            background: var(--clx-accent, #0f7490); border-color: var(--clx-accent, #0f7490);
            color: #fff; font-weight: 600;
        }
        .cap-btn-sm.primary:hover { background: var(--clx-accent-hover, #0c6478); }

        /* SBAR */
        .cap-sbar-block {
            border-left: 4px solid var(--clx-accent, #0f7490);
            padding: 10px 14px; margin-bottom: 12px;
            background: var(--clx-bg-surface-2, #f7f9fc);
            border-radius: 0 5px 5px 0;
        }
        .cap-sbar-block h4 {
            margin: 0 0 10px; font-size: 14px; font-weight: 700;
            color: var(--clx-text-primary, #1a3a5c);
            display: flex; align-items: center;
        }
        .cap-sbar-letter {
            display: inline-block; width: 26px; height: 26px; line-height: 26px;
            background: var(--clx-accent, #0f7490); color: #fff;
            border-radius: 50%; font-weight: 700; font-size: 13px;
            text-align: center; margin-right: 10px;
        }

        /* Behavior (ABC) */
        .cap-behavior-event {
            border: 1px solid var(--clx-border, #d1dce8);
            border-radius: 6px;
            padding: 14px;
            margin-bottom: 14px;
            background: var(--clx-bg-surface, #fff);
        }
        .cap-behavior-head {
            display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
            padding-bottom: 8px; border-bottom: 1px solid var(--clx-border, #d1dce8);
        }
        .cap-behavior-num {
            font-weight: 700; color: var(--clx-accent, #0f7490);
            flex: 1; font-size: 14px;
        }
        .cap-behavior-section {
            font-size: 12px; font-weight: 700;
            color: var(--clx-accent, #0f7490);
            text-transform: uppercase; letter-spacing: 0.04em;
            margin: 12px 0 6px;
            border-bottom: 1px dashed var(--clx-border, #d1dce8);
            padding-bottom: 4px;
        }

        /* NCSBN */
        .cap-ncsbn-step {
            display: grid; grid-template-columns: 50px 1fr; gap: 12px;
            padding: 14px; border: 1px solid var(--clx-border, #d1dce8);
            border-radius: 6px; margin-bottom: 12px;
            background: var(--clx-bg-surface, #fff);
        }
        .cap-ncsbn-num {
            display: flex; align-items: center; justify-content: center;
            background: var(--clx-accent, #0f7490); color: #fff;
            border-radius: 50%; width: 40px; height: 40px;
            font-size: 16px; font-weight: 800;
        }
        .cap-ncsbn-num.wide { font-size: 13px; letter-spacing: -0.02em; }
        .cap-ncsbn-body h4 {
            margin: 0 0 4px; font-size: 14px; font-weight: 700;
            color: var(--clx-text-primary, #1a3a5c);
        }
        .cap-ncsbn-migrated {
            margin: 0 0 12px; padding: 8px 10px;
            border: 1px solid var(--clx-border, #d1dce8); border-radius: 5px;
            background: var(--clx-bg-surface-2, #f7f9fc);
        }

        /* Progress Notes */
        .cap-pn-note {
            border: 1px solid var(--clx-border, #d1dce8);
            border-radius: 6px;
            padding: 14px;
            margin-bottom: 14px;
            background: var(--clx-bg-surface, #fff);
        }
        .cap-pn-head {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 10px;
            padding-bottom: 8px; border-bottom: 1px solid var(--clx-border, #d1dce8);
        }
        .cap-pn-num { font-weight: 700; color: var(--clx-accent, #0f7490); flex: 1; font-size: 14px; }
        .cap-pn-format { width: auto; font-weight: 600; }
        .cap-pn-row {
            display: grid; grid-template-columns: 60px 1fr; gap: 10px;
            align-items: start; margin-bottom: 8px;
        }
        .cap-pn-letter {
            background: var(--clx-accent, #0f7490); color: #fff;
            padding: 6px 4px; border-radius: 4px;
            font-weight: 700; font-size: 14px; text-align: center;
            display: flex; flex-direction: column; align-items: center;
            line-height: 1.1;
        }
        .cap-pn-letter small {
            display: block; font-weight: 400; font-size: 9px;
            margin-top: 2px; opacity: 0.85;
        }
        .cap-pn-help {
            margin-top: 18px; font-size: 12.5px;
        }
        .cap-pn-help summary {
            cursor: pointer; color: var(--clx-accent, #0f7490);
            font-weight: 600;
        }
        .cap-pn-help[open] {
            padding: 10px;
            background: var(--clx-bg-surface-2, #f7f9fc);
            border-radius: 6px;
            margin-top: 10px;
        }
        .cap-pn-help p { margin: 4px 0; line-height: 1.6; }

        /* Care Plan */
        .cap-cp-box {
            border: 1px solid var(--clx-border, #d1dce8);
            border-radius: 6px;
            padding: 14px;
            margin-bottom: 12px;
            background: var(--clx-bg-surface-2, #f7f9fc);
        }
        .cap-cp-box h4 { margin: 0 0 4px; font-size: 14px; color: var(--clx-accent, #0f7490); }
        .cap-cp-iv {
            margin-top: 12px; padding: 10px;
            border: 1px solid var(--clx-border, #d1dce8);
            border-radius: 5px;
            background: var(--clx-bg-surface, #fff);
        }
        .cap-cp-iv h5 {
            font-size: 13px; font-weight: 700;
            color: var(--clx-text-primary, #1a3a5c);
            margin: 0 0 8px;
            display: flex; align-items: center; gap: 8px;
        }
        .cap-cp-iv-tag {
            background: var(--clx-accent, #0f7490); color: #fff;
            padding: 2px 8px; border-radius: 4px;
            font-size: 11px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.04em;
        }

        /* Head-to-Toe — simple labeled rows */
        .cap-h2t-row {
            margin-bottom: 14px;
            padding: 12px;
            border: 1px solid var(--clx-border, #d1dce8);
            border-radius: 6px;
            background: var(--clx-bg-surface, #fff);
        }
        .cap-h2t-row .cap-label {
            color: var(--clx-accent, #0f7490);
            font-size: 13px;
            text-transform: none;
            letter-spacing: normal;
        }

        /* Head-to-Toe (Word form layout): two columns of regions, stacked on phones */
        .cap-h2t-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
        .cap-h2t-col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
        .cap-h2t-region {
            border: 1px solid var(--clx-border, #d1dce8); border-radius: 6px;
            background: var(--clx-bg-surface, #fff); padding: 10px 12px 12px; min-width: 0;
        }
        .cap-h2t-region > h4 {
            margin: 0 0 10px; padding-bottom: 6px; font-size: 14px; font-weight: 700;
            color: var(--clx-accent, #0f7490); border-bottom: 1px solid var(--clx-border, #d1dce8);
        }
        .cap-h2t-item {
            display: grid; grid-template-columns: minmax(84px, 34%) minmax(0, 1fr);
            gap: 4px 8px; align-items: start; margin-bottom: 6px;
        }
        .cap-h2t-item.sub { padding-left: 14px; }
        .cap-h2t-lbl {
            font-size: 12.5px; font-weight: 600; color: var(--clx-text-primary, #1a3a5c);
            padding-top: 7px; overflow-wrap: anywhere;
        }
        .cap-h2t-item.sub > .cap-h2t-lbl::before { content: '\27F6\00a0'; color: var(--clx-text-muted, #718096); font-weight: 400; }
        .cap-h2t-grouplbl { padding-top: 2px; margin: 4px 0 4px; }
        .cap-h2t-tf { min-height: 34px; padding: 6px 8px; resize: vertical; overflow: hidden; }
        .cap-h2t-checks { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
        .cap-h2t-chk {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 5px 10px; cursor: pointer; font-size: 12.5px;
            border: 1px solid var(--clx-border, #d1dce8); border-radius: 5px;
            background: var(--clx-bg-surface, #fff); color: var(--clx-text-primary, #1a3a5c);
        }
        .cap-h2t-chk input { accent-color: var(--clx-accent, #0f7490); width: 16px; height: 16px; margin: 0; flex: none; }
        .cap-h2t-chk:hover { background: var(--clx-bg-hover, #f7fafd); }
        .cap-h2t-chk.selected { border-color: var(--clx-accent, #0f7490); background: rgba(var(--clx-accent-rgb, 15, 116, 144), 0.06); }
        .cap-h2t-chk:focus-within { outline: 2px solid var(--clx-accent, #0f7490); outline-offset: 1px; }
        .cap-h2t-fields { display: flex; flex-wrap: wrap; gap: 6px 12px; min-width: 0; }
        .cap-h2t-mini { display: inline-flex; align-items: flex-start; gap: 6px; min-width: 0; }
        .cap-h2t-mini > label { font-size: 12.5px; font-weight: 600; color: var(--clx-text-primary, #1a3a5c); padding-top: 8px; white-space: nowrap; }
        .cap-h2t-mini .cap-tf { width: 88px; }
        .cap-h2t-split .cap-tf { width: 64px; }
        .cap-h2t-sep { padding-top: 7px; color: var(--clx-text-muted, #718096); }
        .cap-h2t-group { margin-bottom: 6px; }
        .cap-h2t-grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 10px; }
        .cap-h2t-cell { display: flex; flex-direction: column; min-width: 0; }
        .cap-h2t-cell .cap-h2t-lbl { padding-top: 0; margin-bottom: 3px; font-weight: 500; }
        .cap-h2t-prev {
            margin-top: 10px; padding: 8px 10px; border-left: 3px solid var(--clx-border, #d1dce8);
            background: var(--clx-bg-surface-2, #f7f9fc); border-radius: 0 5px 5px 0;
        }
        .cap-h2t-prev .cap-h2t-lbl { display: block; padding-top: 0; margin-bottom: 4px; color: var(--clx-text-secondary, #4a5568); }
        @media (max-width: 800px) { .cap-h2t-cols { grid-template-columns: minmax(0, 1fr); } }
        @media (max-width: 420px) {
            .cap-h2t-item { grid-template-columns: minmax(0, 1fr); }
            .cap-h2t-item > .cap-h2t-lbl { padding-top: 0; }
            .cap-h2t-item > .cap-h2t-lbl:empty { display: none; }
            .cap-h2t-grid2 { grid-template-columns: minmax(0, 1fr); }
        }

        /* Head-to-Toe body diagram (Skin) */
        .cap-body { margin-top: 8px; }
        .cap-body-svg {
            display: block; width: 100%; max-width: 380px; height: auto; margin: 6px auto 0;
            color: var(--clx-text-secondary, #4a5568); cursor: crosshair;
            background: var(--clx-bg-surface, #fff);
            border: 1px solid var(--clx-border, #d1dce8); border-radius: 6px;
            touch-action: manipulation;
        }
        .cap-body-svg .cap-body-hit { fill: transparent; }
        .cap-body-svg .cap-body-line { fill: none; stroke: currentColor; stroke-width: 1; stroke-linejoin: round; stroke-linecap: round; }
        .cap-body-svg .cap-body-lbl { fill: var(--clx-text-muted, #718096); font-size: 8px; font-family: inherit; }
        .cap-body-svg .cap-body-side { fill: var(--clx-text-muted, #718096); font-size: 7px; font-weight: 700; font-family: inherit; }
        .cap-body-marker { cursor: pointer; }
        .cap-body-marker circle { fill: var(--clx-accent, #0f7490); stroke: var(--clx-bg-surface, #fff); stroke-width: 1; }
        .cap-body-marker text { fill: #fff; font-size: 6.5px; font-weight: 700; font-family: inherit; pointer-events: none; }
        .cap-body-marker.active circle { stroke: var(--clx-text-primary, #1a3a5c); stroke-width: 1.6; }
        .cap-body-list { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
        .cap-body-mk {
            display: grid; grid-template-columns: 28px minmax(100px, 132px) minmax(0, 1fr) 36px;
            gap: 6px; align-items: start;
        }
        .cap-body-num {
            display: inline-flex; align-items: center; justify-content: center; margin-top: 6px;
            width: 24px; height: 24px; border-radius: 50%;
            background: var(--clx-accent, #0f7490); color: #fff; font-size: 12px; font-weight: 700;
        }
        .cap-body-mk.unplaced .cap-body-num {
            background: transparent; color: var(--clx-accent, #0f7490); border: 1.5px dashed currentColor;
        }
        .cap-body .cap-add-row { margin-top: 8px; }
        @media (max-width: 480px) {
            .cap-body-mk { grid-template-columns: 28px minmax(0, 1fr) 44px; }
            .cap-body-mk select { grid-column: 2; grid-row: 1; }
            .cap-body-mk .cap-row-del { grid-column: 3; grid-row: 1; }
            .cap-body-mk textarea { grid-column: 1 / -1; grid-row: 2; }
        }

        /* Hendrich — checklist rows */
        .cap-hendrich-list { display: flex; flex-direction: column; gap: 4px; }
        .cap-hendrich-row {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 12px;
            border: 1px solid var(--clx-border, #d1dce8);
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            background: var(--clx-bg-surface, #fff);
        }
        .cap-hendrich-row:hover { background: var(--clx-bg-hover, #f7fafd); }
        .cap-hendrich-row.selected {
            border-color: var(--clx-accent, #0f7490);
            background: rgba(var(--clx-accent-rgb, 15, 116, 144), 0.06);
        }
        .cap-hendrich-row input { accent-color: var(--clx-accent, #0f7490); }
        .cap-hendrich-label { flex: 1; color: var(--clx-text-primary, #1a3a5c); }
        .cap-hendrich-pts {
            background: var(--clx-accent, #0f7490); color: #fff;
            padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700;
        }
        /* Factor row + findings column side by side; stacked on phones */
        .cap-hendrich-item {
            display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr);
            gap: 6px; align-items: stretch;
        }
        .cap-hendrich-head {
            display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 6px;
            font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
            color: var(--clx-text-secondary, #4a5568); margin-bottom: 4px;
        }
        .cap-hendrich-note { min-height: 38px; resize: vertical; overflow: hidden; }
        .cap-ug-qual { display: block; font-size: 11.5px; color: var(--clx-text-muted, #718096); margin-top: 2px; }
        @media (max-width: 600px) {
            .cap-hendrich-item { grid-template-columns: 1fr; gap: 4px; margin-bottom: 6px; }
            .cap-hendrich-head { display: none; }
        }

        /* Dated score columns (Braden Assess 1–4, Morse Admission/Review) */
        .cap-assess-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
        .cap-assess-tab {
            flex: 1 1 120px; min-width: 0;
            display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
            padding: 7px 10px; font: inherit; text-align: left; cursor: pointer;
            border: 1px solid var(--clx-border, #d1dce8); border-radius: 6px;
            background: var(--clx-bg-surface, #fff); color: var(--clx-text-primary, #1a3a5c);
        }
        .cap-assess-tab strong { font-size: 13px; }
        .cap-assess-tab small { font-size: 11px; color: var(--clx-text-muted, #718096); overflow-wrap: anywhere; }
        .cap-assess-tab:hover { background: var(--clx-bg-hover, #f7fafd); }
        .cap-assess-tab.active {
            border: 2px solid var(--clx-accent, #0f7490); padding: 6px 9px;
            background: rgba(var(--clx-accent-rgb, 15, 116, 144), 0.06);
        }
        .cap-assess-tab:focus-visible { outline: 2px solid var(--clx-accent, #0f7490); outline-offset: 2px; }
        .cap-assess-actions { margin-top: 8px; }
        .cap-pick-badge {
            display: inline-block; margin-left: 4px; padding: 0 6px; border-radius: 999px;
            font-size: 10.5px; font-weight: 600; line-height: 1.6; vertical-align: middle;
            border: 1px solid var(--clx-border, #d1dce8); color: var(--clx-text-secondary, #4a5568);
            background: var(--clx-bg-surface-2, #f7f9fc);
        }
        .cap-braden-legend { font-weight: 600; color: var(--clx-text-secondary, #4a5568); margin: 0 0 8px; }
        .cap-sum-wrap { overflow-x: auto; margin-top: 4px; }
        .cap-sum-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
        .cap-sum-table th, .cap-sum-table td {
            padding: 6px 8px; border: 1px solid var(--clx-border, #d1dce8);
            text-align: left; vertical-align: top; overflow-wrap: break-word; white-space: normal;
        }
        .cap-sum-table td, .cap-sum-table thead th { min-width: 76px; }
        .cap-sum-table thead th, .cap-sum-table tbody th {
            background: var(--clx-bg-surface-2, #f7f9fc); font-weight: 600;
            color: var(--clx-text-primary, #1a3a5c);
        }
        .cap-sum-table tbody th { min-width: 110px; }
        .cap-sum-table .active { box-shadow: inset 0 0 0 9999px rgba(var(--clx-accent-rgb, 15, 116, 144), 0.06); }
        .cap-sum-table thead th.active { color: var(--clx-accent, #0f7490); }
        .cap-sum-table tr.cap-sum-total td, .cap-sum-table tr.cap-sum-total th { font-weight: 700; }
        .cap-band-table { width: auto; min-width: 240px; margin-top: 12px; }

        /* Braden option cards: the radio is visually hidden, the card shows focus */
        .cap-braden-opt { position: relative; }
        .cap-braden-opt:focus-within { outline: 2px solid var(--clx-accent, #0f7490); outline-offset: 1px; }

        /* Mini-Cog words */
        .cap-word-opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
        .cap-word-opt {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 8px 14px; cursor: pointer; font-size: 14px; font-weight: 600;
            border: 1px solid var(--clx-border, #d1dce8); border-radius: 6px;
            background: var(--clx-bg-surface, #fff); color: var(--clx-text-primary, #1a3a5c);
        }
        .cap-word-opt input { accent-color: var(--clx-accent, #0f7490); width: 18px; height: 18px; }
        .cap-word-opt.selected {
            border-color: var(--clx-accent, #0f7490);
            background: rgba(var(--clx-accent-rgb, 15, 116, 144), 0.06);
        }

        /* Lab Values (TABLE 3) */
        .cap-labs-wrap { overflow-x: auto; }
        .cap-labs-table { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 640px; }
        .cap-labs-table th, .cap-labs-table td {
            padding: 4px 6px; border: 1px solid var(--clx-border, #d1dce8); vertical-align: top; text-align: left;
        }
        .cap-labs-table thead th {
            background: var(--clx-bg-surface-2, #f7f9fc); font-weight: 700;
            color: var(--clx-accent, #0f7490); font-size: 11.5px;
        }
        /* Normal Values wide enough for a one-line 'Textbook: …' suggestion */
        .cap-labs-table thead th:nth-child(1) { width: 15%; }
        .cap-labs-table thead th:nth-child(2) { width: 22%; }
        .cap-labs-table thead th:nth-child(3) { width: 12%; }
        .cap-labs-table thead th:nth-child(4) { width: 15%; }
        .cap-labs-name { font-weight: 600; color: var(--clx-text-primary, #1a3a5c); padding-top: 9px !important; }
        .cap-labs-group th {
            background: var(--clx-bg-surface-2, #f7f9fc);
            font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
            color: var(--clx-accent, #0f7490);
        }
        .cap-labs-table textarea {
            border: none; padding: 5px 4px; min-height: 32px; font-size: 12.5px;
            background: transparent; resize: vertical; overflow: hidden;
        }
        .cap-labs-extra .cap-labs-name textarea { font-weight: 600; }
        /* the textbook range in a blank cell is a suggestion, not a value */
        .cap-labs-table textarea[data-col="normal"]::placeholder { font-style: italic; }
        .cap-labs-act { width: 40px; text-align: center; }
        .cap-labs-addrow td { border: none; padding: 0; }
        .cap-sr {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
        }
        /* Phones: each lab becomes a card, columns labelled inline */
        @media (max-width: 600px) {
            .cap-labs-wrap { overflow: visible; }
            .cap-labs-table { min-width: 0; }
            .cap-labs-table, .cap-labs-table tbody, .cap-labs-table tr,
            .cap-labs-table th, .cap-labs-table td { display: block; width: auto; box-sizing: border-box; }
            .cap-labs-table thead { display: none; }
            .cap-labs-table tbody tr {
                border: 1px solid var(--clx-border, #d1dce8); border-radius: 6px;
                padding: 8px 10px; margin-bottom: 8px; background: var(--clx-bg-surface, #fff);
            }
            .cap-labs-table th, .cap-labs-table td { border: none; padding: 3px 0; }
            /* shared clinical-ui zebra/hover tints cells with !important */
            .cap-labs-table tbody tr td, .cap-labs-table tbody tr:hover td { background: transparent !important; }
            .cap-labs-name { padding: 0 0 4px !important; font-size: 14px; }
            .cap-labs-table td[data-label]::before {
                content: attr(data-label); display: block; margin-bottom: 2px;
                font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
                color: var(--clx-text-secondary, #4a5568);
            }
            .cap-labs-table textarea { border: 1px solid var(--clx-border, #d1dce8); padding: 7px 9px; }
            .cap-labs-table tr.cap-labs-group { border: none; padding: 0; margin: 16px 0 6px; background: none; }
            .cap-labs-group th { background: none; padding: 0; font-size: 13px; }
            .cap-labs-table tr.cap-labs-addrow { border: none; padding: 0; background: none; }
            .cap-labs-act { width: auto; text-align: right; }
            .cap-labs-act:empty { display: none; }
        }

        /* APA References */
        .cap-ref-row {
            display: grid; grid-template-columns: 24px 1fr 36px;
            gap: 8px; align-items: start;
            margin-bottom: 8px;
        }
        .cap-ref-num {
            font-weight: 700;
            font-size: 14px;
            color: var(--clx-text-muted, #718096);
            line-height: 1.8;
        }

        /* Nursing Concept Map — the Word form's boxes. Phones: stacked in
           reading order. Wide screens: a 3 x 3 map (each box sets
           --cm-row / --cm-col) with connectors in an SVG overlay. */
        .cap-cm-map { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
        .cap-cm-links { display: none; }
        .cap-cm-box {
            position: relative; z-index: 1; min-width: 0;
            display: flex; flex-direction: column; gap: 4px;
            padding: 10px 12px;
            border: 1px solid var(--clx-border-strong, #b0bec5); border-radius: 8px;
            background: var(--clx-bg-surface, #fff);
        }
        .cap-cm-box.center { border: 2px solid var(--clx-accent, #0f7490); }
        .cap-cm-lbl {
            font-size: 13px; font-weight: 700;
            color: var(--clx-text-primary, #1a3a5c);
            margin-top: 4px;
        }
        .cap-cm-box > .cap-cm-lbl:first-child { margin-top: 0; }
        .cap-cm-box.center > .cap-cm-lbl { color: var(--clx-accent, #0f7490); }
        .cap-cm-tf { min-height: 60px; overflow: hidden; }
        .cap-cm-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
        .cap-cm-item { display: grid; grid-template-columns: 20px minmax(0, 1fr) 36px; gap: 4px; align-items: start; }
        .cap-cm-num { font-size: 13px; font-weight: 700; color: var(--clx-text-muted, #718096); line-height: 2.2; }
        .cap-cm-list .cap-cm-tf { min-height: 44px; }
        .cap-cm-add { align-self: flex-start; margin-top: 6px; }
        .cap-cm-copy { align-self: flex-start; margin-top: 2px; text-align: left; }
        .cap-cm-prev {
            margin-top: 8px; padding: 6px 8px; border-left: 3px solid var(--clx-border, #d1dce8);
            background: var(--clx-bg-surface-2, #f7f9fc); border-radius: 0 5px 5px 0;
        }
        .cap-cm-prev .cap-cm-lbl { font-size: 12px; font-weight: 600; color: var(--clx-text-secondary, #4a5568); }
        @media (min-width: 900px) {
            .cap-cm-map {
                position: relative; display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 28px 30px;
            }
            .cap-cm-box { grid-row: var(--cm-row, auto); grid-column: var(--cm-col, auto); }
            .cap-cm-links {
                display: block; position: absolute; inset: 0; width: 100%; height: 100%;
                pointer-events: none; z-index: 0; overflow: visible;
            }
        }
        .cap-cm-links line { stroke: var(--clx-text-muted, #718096); stroke-width: 1.5; }
        .cap-cm-links .cap-cm-arrowhead { fill: var(--clx-text-muted, #718096); }
        /* Care plan detail (optional, the pre-6/24 problem list) */
        .cap-cm-detail {
            border: 1px solid var(--clx-border, #d1dce8); border-radius: 6px;
            background: var(--clx-bg-surface, #fff);
        }
        .cap-cm-detail summary {
            padding: 12px 14px; cursor: pointer; font-weight: 700;
            color: var(--clx-text-primary, #1a3a5c);
            background: var(--clx-bg-surface-2, #f7f9fc); border-radius: 6px;
        }
        .cap-cm-detail[open] summary { border-bottom: 1px solid var(--clx-border, #d1dce8); border-radius: 6px 6px 0 0; }
        .cap-cm-opt { font-weight: 400; color: var(--clx-text-muted, #718096); }
        .cap-cm-detail-body { padding: 14px; }
        .cap-cm-problem {
            border: 1px solid var(--clx-border, #d1dce8);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 12px;
            background: var(--clx-bg-surface, #fff);
        }
        .cap-cm-head {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 10px;
        }
        .cap-cm-name { flex: 1; font-weight: 700; font-size: 14px; }
        .cap-cm-grid { display: flex; flex-direction: column; gap: 8px; }

        /* Concept Map Essay — one panel per template section, rubric points
           as small pills, the template prompt as the hint, live word counts */
        .cap-essay-head { display: flex; align-items: center; gap: 10px; }
        .cap-essay-head h3 { flex: 1; min-width: 0; }
        .cap-pts {
            flex: none; white-space: nowrap;
            font-size: 11px; font-weight: 600; line-height: 1.6;
            padding: 0 8px; border-radius: 999px;
            border: 1px solid var(--clx-border, #d1dce8);
            background: var(--clx-bg-surface, #fff);
            color: var(--clx-text-secondary, #4a5568);
        }
        .cap-essay-refnote { margin: 0 0 12px; line-height: 1.7; }
        /* Links inside a sentence: opt out of the shared ≤768px 44px button
           height, which split the sentence into gapped lines */
        .cap-essay-link, .cap-link-btn {
            min-height: 0;
            padding: 0; border: 0; background: none; font: inherit;
            color: var(--clx-accent, #0f7490);
            text-decoration: underline; text-underline-offset: 2px;
            cursor: pointer;
        }
        .cap-essay-link:hover, .cap-link-btn:hover { text-decoration-thickness: 2px; }
        .cap-essay-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
        .cap-essay-total {
            margin-right: auto;
            font-size: 13px; font-weight: 600;
            color: var(--clx-text-secondary, #4a5568);
            font-variant-numeric: tabular-nums;
        }
        .cap-essay-actions { display: flex; flex-wrap: wrap; gap: 8px; }
        .cap-essay-actions .cap-btn-sm { text-align: left; }
        .cap-essay-actions > [hidden] { display: none; }
        .cap-essay-name { margin-bottom: 16px; }
        .cap-essay-name input { font-size: 14px; font-weight: 600; }
        .cap-essay-name input::placeholder { font-weight: 400; }
        .cap-essay-part + .cap-essay-part {
            margin-top: 18px; padding-top: 16px;
            border-top: 1px solid var(--clx-border, #d1dce8);
        }
        .cap-essay-parthead { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .cap-essay-h { font-size: 14px; font-weight: 700; color: var(--clx-text-primary, #1a3a5c); }
        .cap-essay-prompt { margin: 0 0 8px; line-height: 1.5; }
        .cap-essay-note { display: block; margin-top: 4px; }
        .cap-essay-tf { min-height: 120px; overflow: hidden; font-size: 14px; line-height: 1.55; }
        .cap-wc {
            margin-top: 4px; text-align: right;
            font-size: 11px; color: var(--clx-text-muted, #718096);
            font-variant-numeric: tabular-nums;
        }
        .cap-essay-profnote { margin: 0 0 8px; line-height: 1.6; }
        @media print { .cap-essay-actions, .cap-essay-refnote, .cap-essay-mapnote, .cap-essay-profnote { display: none; } }

        /* ────────── Data-quality helpers ──────────
           Labs: textbook ranges, H / L / ? flags (letters, never colour
           alone), Not drawn. Hendrich / Mini-Cog / OMEGA Day 2 checks and
           the essay's Pertinent Data inserts. */
        .cap-labs-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin: 0 0 8px; }
        .cap-labs-tools .cap-fineprint { margin: 0; flex: 1 1 240px; min-width: 0; }
        .cap-labs-sexhint { margin: 0 0 10px; }
        .cap-lab-resline { display: flex; align-items: flex-start; gap: 4px; }
        .cap-lab-resline textarea { flex: 1 1 auto; min-width: 0; }
        .cap-lab-flag {
            flex: none; display: inline-flex; align-items: center; justify-content: center;
            min-width: 20px; height: 20px; padding: 0 5px; margin-top: 6px; box-sizing: border-box;
            border-radius: 999px; border: 1px solid transparent;
            font-size: 11px; font-weight: 800; line-height: 1; cursor: help;
        }
        .cap-lab-flag:empty { display: none; }
        /* centred on a one-line result box (taller there: shared ≤768px padding) */
        @media (max-width: 768px) { .cap-lab-flag { margin-top: 12px; } }
        .cap-lab-flag[data-flag="H"] {
            background: var(--clx-danger-bg, #fef2f2); color: var(--clx-danger-text, #991b1b);
            border-color: var(--clx-danger, #dc2626);
        }
        .cap-lab-flag[data-flag="L"] {
            background: var(--clx-info-bg, #e0f2fe); color: var(--clx-info-text, #0c4a6e);
            border-color: var(--clx-info, #0284c7);
        }
        .cap-lab-flag[data-flag="?"] {
            background: transparent; color: var(--clx-text-secondary, #4a5568);
            border: 1px dashed var(--clx-border-strong, #b0bec5);
        }
        /* In-cell action: smaller than the toolbar buttons (still a 24px+ target) */
        .cap-lab-nd {
            display: inline-block; min-height: 0; margin: 2px 0 2px 4px;
            padding: 3px 8px; border-radius: 999px;
            border: 1px dashed var(--clx-border-strong, #b0bec5); background: none;
            font: inherit; font-size: 11px; font-weight: 600; line-height: 1.5;
            color: var(--clx-text-secondary, #4a5568); cursor: pointer;
        }
        .cap-lab-nd:hover { background: var(--clx-bg-hover, #f7fafd); color: var(--clx-text-primary, #1a3a5c); }
        .cap-lab-nd[hidden] { display: none !important; }

        .cap-notice {
            display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
            margin: 0 0 10px; padding: 8px 12px;
            border: 1px solid var(--clx-border, #d1dce8); border-left: 3px solid var(--clx-info, #0284c7);
            border-radius: 6px; background: var(--clx-info-bg, #e0f2fe);
            color: var(--clx-info-text, #0c4a6e); font-size: 13px;
        }
        .cap-notice.warn { border-left-color: var(--clx-warning, #d97706); background: var(--clx-warning-bg, #fffbeb); color: var(--clx-warning-text, #92400e); }
        .cap-notice-text { flex: 1 1 200px; min-width: 0; }
        .cap-notice .cap-btn-sm { text-align: left; }
        .cap-hendrich-checks { margin: 0 0 12px; }
        .cap-hendrich-checks .cap-fineprint { margin: 0 0 4px; font-size: 12px; }

        .cap-mc-status .cap-morse-opts { margin-top: 8px; }
        .cap-mc-note { margin: 2px 0 0; }
        .cap-mc-practice { margin-top: 12px; }
        .cap-mc-practice[hidden] { display: none; }
        .cap-mc-practice .cap-label { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
        .cap-req {
            font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
            padding: 0 6px; border-radius: 999px; line-height: 1.7;
            background: var(--clx-warning-bg, #fffbeb); color: var(--clx-warning-text, #92400e);
        }
        /* shared clinical-ui forces textarea borders with !important */
        .cap-mc-reason:placeholder-shown:not(:focus) { border-color: var(--clx-warning, #d97706) !important; border-left-width: 3px !important; }

        .cap-check-line {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 12px; margin: 0;
            border: 1px solid var(--clx-border, #d1dce8); border-radius: 6px;
            background: var(--clx-bg-surface, #fff);
            font-size: 13px; font-weight: 600; color: var(--clx-text-primary, #1a3a5c); cursor: pointer;
        }
        .cap-check-line input { accent-color: var(--clx-accent, #0f7490); width: 18px; height: 18px; flex: none; margin: 0; }
        .cap-check-line.selected {
            border-color: var(--clx-accent, #0f7490);
            background: rgba(var(--clx-accent-rgb, 15, 116, 144), 0.06);
        }
        .cap-check-note { margin: 4px 0 12px; }

        /* Pertinent Data checklists: abnormal labs, medications */
        .cap-essay-labs, .cap-essay-meds {
            margin: 0 0 8px; border: 1px solid var(--clx-border, #d1dce8); border-radius: 6px;
            background: var(--clx-bg-surface, #fff);
        }
        .cap-essay-labs > summary, .cap-essay-meds > summary {
            padding: 6px 10px; cursor: pointer; border-radius: 6px;
            font-size: 12px; font-weight: 600; color: var(--clx-text-primary, #1a3a5c);
        }
        .cap-essay-labs > summary:hover, .cap-essay-meds > summary:hover { background: var(--clx-bg-hover, #f7fafd); }
        .cap-essay-labs[open] > summary, .cap-essay-meds[open] > summary { border-bottom: 1px solid var(--clx-border, #d1dce8); border-radius: 6px 6px 0 0; }
        .cap-essay-meds-body { padding: 10px; }
        .cap-essay-meds-body > .cap-fineprint { margin: 0 0 8px; line-height: 1.5; }
        .cap-essay-meds-body > :last-child { margin-bottom: 0; }
        .cap-essay-meds-actions + .cap-essay-labnote { margin-top: 10px; }
        .cap-essay-medlist { list-style: none; margin: 0 0 10px; padding: 0; display: flex; flex-direction: column; gap: 4px; }
        .cap-essay-medopt {
            display: flex; align-items: flex-start; gap: 8px;
            padding: 6px 10px; border: 1px solid var(--clx-border, #d1dce8); border-radius: 5px;
            background: var(--clx-bg-surface, #fff); cursor: pointer; font-size: 13px;
        }
        .cap-essay-medopt input { accent-color: var(--clx-accent, #0f7490); width: 16px; height: 16px; flex: none; margin: 2px 0 0; }
        .cap-essay-medopt.selected {
            border-color: var(--clx-accent, #0f7490);
            background: rgba(var(--clx-accent-rgb, 15, 116, 144), 0.06);
        }
        .cap-essay-medtext { min-width: 0; overflow-wrap: anywhere; }
        .cap-essay-medname { font-weight: 600; color: var(--clx-text-primary, #1a3a5c); }
        .cap-essay-medsub { display: block; font-size: 11.5px; color: var(--clx-text-muted, #718096); }
        .cap-essay-medin {
            font-size: 10.5px; font-weight: 600; padding: 0 6px; border-radius: 999px; white-space: nowrap;
            background: var(--clx-success-bg, #ecfdf5); color: var(--clx-success-text, #065f46);
        }
        .cap-essay-meds-actions { display: flex; flex-wrap: wrap; gap: 8px; }
        @media print {
            .cap-labs-tools, .cap-labs-sexhint, .cap-lab-nd, .cap-hendrich-checks,
            .cap-essay-labs, .cap-essay-meds, .cap-check-note { display: none !important; }
        }

        /* Case Study — collapsible numbered sections */
        .cap-cs-section {
            border: 1px solid var(--clx-border, #d1dce8);
            border-radius: 6px;
            margin-bottom: 12px;
            background: var(--clx-bg-surface, #fff);
            overflow: hidden;
        }
        .cap-cs-section summary {
            padding: 12px 16px;
            cursor: pointer;
            background: var(--clx-bg-surface-2, #f7f9fc);
            font-weight: 700;
            color: var(--clx-text-primary, #1a3a5c);
            display: flex; align-items: center; gap: 12px;
            list-style: none;
        }
        .cap-cs-section summary::-webkit-details-marker { display: none; }
        .cap-cs-section[open] summary { border-bottom: 1px solid var(--clx-border, #d1dce8); }
        .cap-cs-num {
            display: inline-flex; align-items: center; justify-content: center;
            background: var(--clx-accent, #0f7490); color: #fff;
            border-radius: 50%; width: 28px; height: 28px;
            font-weight: 800; font-size: 13px;
        }
        .cap-cs-section summary::after {
            content: '▾'; margin-left: auto;
            color: var(--clx-text-muted, #718096);
            transition: transform 0.15s;
        }
        .cap-cs-section[open] summary::after { transform: rotate(180deg); }
        .cap-cs-body { padding: 14px; }

        /* ────────── Mobile polish ────────── */
        @media (max-width: 600px) {
            .cap-editor-head { padding: 8px 10px; gap: 8px; }
            .cap-back { font-size: 11.5px; padding: 4px 8px; }
            .cap-title-input { min-width: 120px; font-size: 14px; }
            .cap-modules-btn { padding: 5px 9px; font-size: 11.5px; }
            .cap-tabs { padding: 0 10px; }
            .cap-tab { padding: 9px 10px; font-size: 12px; }
            .cap-content { padding: 14px 12px 60px; }
            .cap-drawer { width: 88vw; }
            .cap-drawer-print, .cap-drawer-page .cap-drawer-print { padding-left: 26px; }
            .cap-drawer select.cap-print-mode { flex: 1 1 auto; }
            .cap-offer-slot { padding: 12px 12px 0; }
            .cap-modal.wide { max-width: 100%; }
            .cap-pn-row { grid-template-columns: 1fr; }
            .cap-pn-letter { padding: 4px 8px; flex-direction: row; gap: 6px; }
            .cap-pn-letter small { display: inline; margin-top: 0; }
            .cap-ncsbn-step { grid-template-columns: 36px 1fr; gap: 8px; padding: 10px; }
            .cap-ncsbn-num { width: 30px; height: 30px; font-size: 13px; }
            .cap-ncsbn-num.wide { width: 36px; height: 36px; font-size: 11px; }
            .cap-ref-row { grid-template-columns: 18px 1fr 28px; }
            .cap-cm-head { flex-wrap: wrap; }
        }

        /* Touch targets ≥44px on touch screens */
        @media (pointer: coarse) {
            .cap-back, .cap-modules-btn, .cap-tab, .cap-btn-sm, .cap-add-row {
                min-height: 44px;
                display: inline-flex; align-items: center;
            }
            .cap-row-del, .cap-drawer-close { min-width: 44px; min-height: 44px; }
            .cap-drawer-row { min-height: 44px; }
            .cap-drawer-toggle { min-height: 36px; }
            /* 16px keeps iOS from zooming in on focus */
            .cap-drawer select.cap-print-mode,
            .cap-drawer input.cap-print-reason {
                min-height: 44px;
                font-size: 16px !important;
                padding: 6px 10px !important;
            }
            input.cap-tf, select.cap-tf { min-height: 44px; }
            .cap-assess-tab, .cap-word-opt, .cap-morse-opt, .cap-hendrich-row { min-height: 44px; }
            .cap-hendrich-note, .cap-labs-table textarea { min-height: 44px; }
            .cap-h2t-chk, .cap-h2t-tf { min-height: 44px; }
            .cap-h2t-lbl, .cap-h2t-mini > label, .cap-h2t-sep { padding-top: 12px; }
            .cap-h2t-cell .cap-h2t-lbl, .cap-h2t-grouplbl, .cap-h2t-prev .cap-h2t-lbl { padding-top: 0; }
            .cap-body-num { margin-top: 10px; }
            .cap-cm-copy, .cap-cm-detail summary { min-height: 44px; }
            .cap-cm-item { grid-template-columns: 20px minmax(0, 1fr) 44px; }
            /* In-cell Not drawn stays compact (28px) so 18 lab rows don't
               double in height; everything else gets the 44px target */
            .cap-lab-nd { padding: 4px 10px; }
            .cap-check-line, .cap-essay-medopt { min-height: 44px; }
            .cap-essay-labs > summary, .cap-essay-meds > summary { padding: 12px 10px; min-height: 44px; box-sizing: border-box; }
            .cap-link-btn { padding: 4px 0; }
        }

        /* ────────── Print stylesheet ──────────
           When printing from /clinical/packet/, hide all chrome and let
           the editor body flow as plain content. The PRIMARY export path
           is the PDF button — print is a back-up. */
        @media print {
            .site-header,
            .cap-editor-head,
            .cap-tabs,
            .cap-drawer,
            .cap-drawer-backdrop,
            .cap-offer-slot,
            #toastContainer,
            .bsn-offline-banner { display: none !important; }
            body { background: #fff !important; }
            .cap-content { max-width: none; padding: 0 !important; }
            .cap-panel { box-shadow: none !important; border: 1px solid #888; page-break-inside: avoid; }
            .cap-tf, .cap-tf:focus { box-shadow: none !important; border-color: #aaa; }
            /* Meds table fits the page instead of clipping its last columns */
            .cap-meds-wrap { overflow: visible; }
            .cap-meds-table { min-width: 0; table-layout: fixed; }
            .cap-meds-del, .cap-add-row { display: none; }
            .cap-labs-wrap, .cap-sum-wrap { overflow: visible; }
            .cap-labs-table { min-width: 0; }
            .cap-labs-act, .cap-assess-actions { display: none; }
            .cap-body-mk .cap-row-del, .cap-body .cap-add-row { display: none; }
            .cap-cs-section, .cap-behavior-event, .cap-pn-note,
            .cap-cm-problem, .cap-cm-box, .cap-h2t-row, .cap-h2t-region, .cap-cp-box {
                page-break-inside: avoid;
            }
        }

        [data-theme="dark"] .cap-editor-head,
        [data-theme="dark"] .cap-tabs,
