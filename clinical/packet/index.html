    </style>
</head>
<body>
    <header class="site-header">
        <a href="/home/" class="logo-link"><img src="/logo-dark.svg" alt="BendBSN" class="site-logo" onerror="this.src='/logo-mark.svg'"></a>
    </header>

    <div class="cap-sticky">
    <!-- Editor head: back, title, save status, module toggle, export -->
    <div class="cap-editor-head">
        <a href="/clinical/" class="cap-back">← My Packets</a>
        <input type="text" id="capTitle" class="cap-title-input" placeholder="Untitled packet" maxlength="80">
        <span class="cap-save-status" id="capSaveStatus">Saved</span>
        <button class="cap-modules-btn" onclick="openModuleDrawer()">⚙️ Modules</button>
        <!-- Shown for course-profile packets only (refreshCheckUi) -->
        <button type="button" class="cap-modules-btn cap-check-btn" id="capCheckBtn" hidden aria-haspopup="dialog"
                onclick="openCheckDrawer({ returnFocus: this })" title="Pre-submit check against the rubric and template">
            <span aria-hidden="true">🔎</span> Check<span class="cap-check-badge" id="capCheckBadge" hidden></span>
        </button>
        <button class="cap-modules-btn" id="capExportPdfBtn" onclick="exportPacketPdf(this)" title="Export to PDF">📄 Export PDF</button>
    </div>

    <!-- Tab bar (rendered dynamically based on enabledModules) -->
    <nav class="cap-tabs" id="capTabs" role="tablist"></nav>
    </div><!-- /cap-sticky -->

    <!-- One-time course-profile offer (filled by renderOffer) -->
    <div class="cap-offer-slot" id="capOfferSlot" role="status"></div>

    <main class="cap-content" id="capContent" role="main"></main>

    <!-- Module toggle drawer -->
    <div class="cap-drawer-backdrop" id="capDrawerBackdrop" onclick="closeModuleDrawer()"></div>
    <aside class="cap-drawer" id="capDrawer" role="dialog" aria-label="Module toggles">
        <div class="cap-drawer-head">
            <h3>⚙️ Modules</h3>
            <button class="cap-drawer-close" onclick="closeModuleDrawer()" aria-label="Close">&times;</button>
        </div>
        <div class="cap-drawer-body" id="capDrawerBody"></div>
        <div class="cap-drawer-foot">
            Turning a module off deletes its data (after a confirmation). To keep the data but leave it out of the PDF, use 'Leave out'.
        </div>
    </aside>

    <!-- Pre-submit check drawer (course-profile packets; filled by renderCheckDrawer) -->
    <div class="cap-drawer-backdrop" id="capCheckBackdrop" onclick="closeCheckDrawer()"></div>
    <aside class="cap-drawer cap-check-drawer" id="capCheckDrawer" role="dialog" aria-modal="true"
           aria-labelledby="capCheckTitle" aria-describedby="capCheckGate capCheckSummary" tabindex="-1">
        <div class="cap-drawer-head">
            <h3 id="capCheckTitle">Pre-submit check</h3>
            <button type="button" class="cap-drawer-close" onclick="closeCheckDrawer()" aria-label="Close">&times;</button>
        </div>
        <div class="cap-check-gate" id="capCheckGate" role="alert" hidden></div>
        <p class="cap-check-summary" id="capCheckSummary" aria-live="polite"></p>
        <div class="cap-drawer-body" id="capCheckBody"></div>
        <div class="cap-drawer-foot cap-check-foot">
            <p class="cap-check-label" id="capCheckLabel">Completeness check against the rubric and template — not a grade.</p>
            <button type="button" class="cap-btn-sm primary" id="capCheckExport">📄 Export PDF</button>
        </div>
    </aside>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="/shared/header.js"></script>
    <script src="/shared/toast.js"></script>
    <script src="/clinical/cap-modules.js"></script>
    <script src="/clinical/cap-renderers.js"></script>
    <script src="/clinical/cap-pdf.js"></script>
    <script src="/clinical/cap-check.js"></script>
    <script>
        // ─── Theme init ───
        (function () {
            const t = localStorage.getItem('bendbsn_theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();

        // ─── Read packet ID ───
        function getPacketId() {
            const p = new URLSearchParams(window.location.search);
            return p.get('id') || '';
        }
        const PACKET_ID = getPacketId();
        if (!PACKET_ID) {
            document.getElementById('capContent').innerHTML =
                '<div class="cap-tab-empty"><strong>No packet selected.</strong>' +
                '<a href="/clinical/" style="color:var(--clx-accent);">← Back to My Packets</a></div>';
        }

        // ─── Firebase init ───
        const firebaseConfig = {
            apiKey: "AIzaSyAmr2W8mekSPJ2pXM3gz1FvarfSBddpfLM",
            authDomain: "bendbsn-17377.firebaseapp.com",
            databaseURL: "https://bendbsn-17377-default-rtdb.firebaseio.com",
            projectId: "bendbsn-17377",
            storageBucket: "bendbsn-17377.appspot.com",
            messagingSenderId: "762882187702",
            appId: "1:762882187702:web:81c97c9eae005666796117"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        const CAP = window.CAP_MODULES;
        const LS_BACKUP_KEY = 'bendbsn_cap_local_' + PACKET_ID;

        // ─── State ───
        let currentUid = null;
        let packetRef = null;
        // Authoritative packet — { meta: {...}, state: {...} }. Mutated by user edits + drawer.
        let packet = null;
        // Currently active tab id (one of enabledModules)
        let activeTab = null;
        // Autosave debounce timer
        let saveTimer = null;
        let lastSaveErrorAt = 0;
        let pendingSave = false;
        // Unsent-edit tracking. Saves are multi-path update()s of only the modules
        // and meta fields that changed, so a second tab/device doesn't get its other
        // modules replaced by this tab's stale copy. fullWrite = set() the whole
        // packet (only used when restoring a local copy or the server copy).
        let editSeq = 0;
        const dirtyMods = new Set();
        const dirtyMeta = new Set();
        let fullWrite = false;
        function hasUnsentEdits() {
            return !!saveTimer || dirtyMods.size > 0 || dirtyMeta.size > 0 || fullWrite;
        }
        // Patient Info fields mirrored into meta (the list page + fallback title read meta).
        const INFO_META_MAP = { res_initials: 'residentInitials', date: 'date', site: 'site', course: 'course' };

        function setSaveStatus(state) {
            const el = document.getElementById('capSaveStatus');
            el.className = 'cap-save-status ' + (state.cls || 'saved');
            el.textContent = state.text;
        }

        function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

        // ─── Auth + load ───
        auth.onAuthStateChanged(function (user) {
            if (!user) {
                showToast('Please sign in.', 'warning');
                setTimeout(function () { window.location.href = '/'; }, 1500);
                return;
            }
            if (!PACKET_ID) return;
            currentUid = user.uid;
            packetRef = database.ref('emr-clinical/packets/' + currentUid + '/' + PACKET_ID);
            loadPacket();
        });

        function loadPacket() {
            setSaveStatus({ cls: 'saving', text: 'Loading…' });
            // Realtime Database never settles a first read while it can't connect,
            // so say so instead of showing "Loading…" forever. The local backup is
            // deliberately NOT auto-loaded here: editing a possibly older copy would
            // overwrite newer server data (packetRef.set) once the connection returns.
            const loadWatchdog = setTimeout(function () {
                if (packet) return;
                setSaveStatus({ cls: 'offline', text: 'Can\'t reach server — retrying…' });
                showToast('Can\'t reach the server. Your packet will load when the connection returns.', 'warning');
            }, 5000);
            packetRef.once('value').then(function (snap) {
                clearTimeout(loadWatchdog);
                const val = snap.val();
                if (!val) {
                    document.getElementById('capContent').innerHTML =
                        '<div class="cap-tab-empty"><strong>Packet not found.</strong>' +
                        '<a href="/clinical/" style="color:var(--clx-accent);">← Back to My Packets</a></div>';
                    return;
                }
                const server = normalizePacket({
                    meta: val.meta || {},
                    state: val.state || {}
                });
                // The local backup only exists while edits are unsynced (it is
                // removed after each successful save). If it is newer than the
                // server copy, those edits never landed: restore them instead of
                // overwriting the only copy with the server version.
                let local = null;
                try { local = JSON.parse(localStorage.getItem(LS_BACKUP_KEY) || 'null'); } catch (e) {}
                if (local && local.meta && typeof local.meta === 'object' &&
                        (local.meta.updatedAt || 0) > (server.meta.updatedAt || 0)) {
                    packet = normalizePacket(local);
                    renderEditor();
                    fullWrite = true;
                    queueAutosave();
                    if (window.showToastAction) {
                        showToastAction({
                            title: 'Restored unsynced changes',
                            message: 'Edits from your last session hadn\'t reached the server, so they were restored and saved.',
                            type: 'info',
                            duration: 20000,
                            actions: [{ label: 'Use server copy instead', onClick: function () {
                                packet = server;
                                renderEditor();
                                fullWrite = true;
                                queueAutosave();
                            } }]
                        });
                    } else {
                        showToast('Restored unsynced local changes.', 'info');
                    }
                    return;
                }
                packet = server;
                try { localStorage.removeItem(LS_BACKUP_KEY); } catch (e) {}
                renderEditor();
                setSaveStatus({ cls: 'saved', text: 'Saved' });
            }).catch(function (err) {
                clearTimeout(loadWatchdog);
                console.error('[CAP editor] load failed:', err);
                // Try local backup
                try {
                    const raw = localStorage.getItem(LS_BACKUP_KEY);
                    if (raw) {
                        packet = normalizePacket(JSON.parse(raw));
                        renderEditor();
                        setSaveStatus({ cls: 'offline', text: 'Offline — local backup' });
                        showToast('Could not reach Firebase. Loaded local backup.', 'warning');
                        return;
                    }
                } catch (e) {}
                document.getElementById('capContent').innerHTML =
                    '<div class="cap-tab-empty"><strong>Could not load packet.</strong>' + esc(err.message || String(err)) + '</div>';
            });
        }

        function writeLocalBackup() {
            try { localStorage.setItem(LS_BACKUP_KEY, JSON.stringify(packet)); } catch (e) {}
        }

        function normalizePacket(p) {
            p = p || {};
            if (!p.meta || typeof p.meta !== 'object') p.meta = {};
            if (!p.state || typeof p.state !== 'object') p.state = {};
            if (!Array.isArray(p.meta.enabledModules)) p.meta.enabledModules = ['info', 'notes'];
            // Print-mode overrides + N/A reasons ({id: value}) are optional;
            // anything that isn't a plain object is dropped (read as none).
            ['printModes', 'naReasons'].forEach(function (k) {
                const v = p.meta[k];
                if (v != null && (typeof v !== 'object' || Array.isArray(v))) delete p.meta[k];
            });
            return p;
        }

        // Copy Patient Info edits into meta so the packet list and the fallback
        // title stay in step with what the student sees on the Info tab.
        function mirrorInfoToMeta() {
            const info = (packet.state && packet.state.info) || {};
            Object.keys(INFO_META_MAP).forEach(function (k) {
                const mk = INFO_META_MAP[k];
                const v = info[k] == null ? '' : String(info[k]).trim();
                if (v && v !== packet.meta[mk]) {
                    packet.meta[mk] = v;
                    dirtyMeta.add(mk);
                }
            });
        }

        // ─── Render: title, tabs, body ───
        function renderEditor() {
            // Seed blank Patient Info fields from the values entered when the
            // packet was created (in memory only; saved with the next Info edit).
            if (!packet.state.info || typeof packet.state.info !== 'object') packet.state.info = {};
            Object.keys(INFO_META_MAP).forEach(function (k) {
                const mk = INFO_META_MAP[k];
                if (!packet.state.info[k] && packet.meta[mk]) packet.state.info[k] = packet.meta[mk];
            });
            setRendererContext();
            // Title
            const titleEl = document.getElementById('capTitle');
            titleEl.value = packet.meta.title || '';
            titleEl.placeholder = packetFallbackTitle();
            // Initial active tab — from URL hash, or first enabled (in tab order)
            const fromHash = (location.hash || '').replace(/^#/, '');
            if (fromHash && packet.meta.enabledModules.indexOf(fromHash) !== -1) {
                activeTab = fromHash;
            } else {
                activeTab = orderedModules()[0] || 'info';
            }
            // Tabs
            renderTabs();
            renderActiveTab();
            renderOffer();
            refreshCheckUi();
        }

        // Renderer context: "patient" (Word form) or "resident" (memory-care
        // packets), and the packet's course profile (or null). Re-run after
        // the profile changes, before re-rendering the tab.
        function setRendererContext() {
            if (!window.CAP_RENDERERS || !window.CAP_RENDERERS.setContext) return;
            window.CAP_RENDERERS.setContext({
                person: CAP.personWord ? CAP.personWord(packet.meta) : 'patient',
                profile: currentProfile(),
                // Read-only look at another module's slice (the concept map
                // offers to copy the diagnosis / med names from them)
                getState: function (id) { return (packet && packet.state && packet.state[id]) || null; }
            });
        }

        function currentProfile() {
            return (packet && CAP.profileFor) ? CAP.profileFor(packet.meta) : null;
        }

        function packetFallbackTitle() {
            const parts = [];
            if (packet.meta.residentInitials) parts.push(packet.meta.residentInitials);
            if (packet.meta.date) parts.push(packet.meta.date);
            if (packet.meta.site) parts.push(packet.meta.site);
            return parts.join(' · ') || 'Untitled packet';
        }

        // Tabs follow the Word form's section order (same as the PDF), not the
        // order modules were switched on; a course profile puts its own tab
        // order first. Display only — stored order is kept.
        function orderedModules() {
            const ids = packet.meta.enabledModules || [];
            if (CAP.orderModulesFor) return CAP.orderModulesFor(packet.meta, ids);
            return CAP.orderModules ? CAP.orderModules(ids) : ids.slice();
        }

        function renderTabs() {
            const tabsEl = document.getElementById('capTabs');
            const html = orderedModules().map(function (id) {
                const m = CAP.MODULE_BY_ID[id];
                if (!m) return '';
                const isActive = id === activeTab ? ' active' : '';
                return '<button type="button" class="cap-tab' + isActive + '" data-mod="' + esc(id) + '"' +
                    (m.tabLabel ? ' title="' + esc(m.label) + '"' : '') + '>' +
                    '<span class="cap-tab-icon">' + m.icon + '</span>' + esc(m.tabLabel || m.label) +
                '</button>';
            }).join('');
            tabsEl.innerHTML = html || '<div style="padding:14px;color:var(--clx-text-muted);font-size:13px;font-style:italic;">No modules enabled. Click ⚙️ Modules to add some.</div>';
        }

        window.switchTab = function (id) {
            activeTab = id;
            history.replaceState(null, '', '?id=' + encodeURIComponent(PACKET_ID) + '#' + id);
            // Refresh tab active state without re-rendering bodies
            document.querySelectorAll('.cap-tab').forEach(function (b) {
                b.classList.toggle('active', b.dataset.mod === id);
            });
            renderActiveTab();
        };
        // Tab clicks are delegated (module ids never go into inline JS strings).
        document.getElementById('capTabs').addEventListener('click', function (ev) {
            const b = ev.target.closest('.cap-tab[data-mod]');
            if (b && packet) window.switchTab(b.dataset.mod);
        });

        // ─── Module body renderer ───
        // Looks up the renderer in CAP_RENDERERS and calls it with the module's
        // state slice + an onChange callback that triggers autosave.
        function renderActiveTab() {
            const contentEl = document.getElementById('capContent');
            if (!activeTab) { contentEl.innerHTML = ''; return; }
            const m = CAP.MODULE_BY_ID[activeTab];
            if (!m) { contentEl.innerHTML = ''; return; }
            if (!packet.state) packet.state = {};
            if (!packet.state[activeTab]) packet.state[activeTab] = {};
            const modState = packet.state[activeTab];
            const renderer = window.CAP_RENDERERS && window.CAP_RENDERERS[activeTab];
            if (renderer) {
                const modId = activeTab;
                renderer(contentEl, modState, function () {
                    queueAutosave(modId);
                    // Typing the course on Patient Info can bring up the profile offer
                    if (modId === 'info') renderOffer();
                });
            } else {
                contentEl.innerHTML =
                    '<div class="cap-tab-empty">' +
                        '<strong>' + esc(m.icon) + ' ' + esc(m.label) + '</strong>' +
                        'No renderer registered for this module yet.' +
                    '</div>';
            }
        }

        // ─── Title editing ───
        document.getElementById('capTitle').addEventListener('input', function (e) {
            if (!packet) return; // not loaded yet / not found
            packet.meta.title = e.target.value;
            dirtyMeta.add('title');
            queueAutosave();
        });

        // ─── Autosave ───
        // modId = the module whose state changed (omit for meta-only edits).
        function queueAutosave(modId) {
            if (!packet) return;
            if (modId) dirtyMods.add(modId);
            editSeq++;
            // Stamp the backup with this edit's time so the next load can tell
            // it is newer than the server copy if the save never lands.
            packet.meta.updatedAt = Date.now();
            setSaveStatus({ cls: 'saving', text: 'Saving…' });
            writeLocalBackup();
            clearTimeout(saveTimer);
            saveTimer = setTimeout(commitSave, 400);
            scheduleCheck(); // profile packets: refresh the Check count / open drawer
        }
        function commitSave() {
            saveTimer = null;
            if (!packetRef || !packet) return;
            if (dirtyMods.has('info')) mirrorInfoToMeta();
            packet.meta.updatedAt = Date.now();
            const seq = editSeq;
            const mods = Array.from(dirtyMods);
            const metaKeys = Array.from(dirtyMeta);
            const full = fullWrite;
            dirtyMods.clear();
            dirtyMeta.clear();
            fullWrite = false;
            if (metaKeys.length) {
                const t = document.getElementById('capTitle');
                if (t) t.placeholder = packetFallbackTitle();
            }
            let write;
            if (full) {
                write = packetRef.set(packet);
            } else {
                const upd = { 'meta/updatedAt': packet.meta.updatedAt };
                metaKeys.forEach(function (k) {
                    upd['meta/' + k] = packet.meta[k] == null ? null : packet.meta[k];
                });
                // A hidden module has no state slice, so null deletes it on the server.
                mods.forEach(function (id) {
                    upd['state/' + id] = (packet.state && packet.state[id]) || null;
                });
                write = packetRef.update(upd);
            }
            pendingSave = true;
            write.then(function () {
                pendingSave = false;
                if (seq === editSeq && !hasUnsentEdits()) {
                    setSaveStatus({ cls: 'saved', text: 'Saved' });
                    // Everything is on the server: drop the local copy so resident
                    // data doesn't linger in this browser's storage.
                    try { localStorage.removeItem(LS_BACKUP_KEY); } catch (e) {}
                }
            }).catch(function (err) {
                console.warn('[CAP editor] save failed:', err);
                pendingSave = false;
                // Put back what didn't land so the retry / unload flush resends it.
                mods.forEach(function (id) { dirtyMods.add(id); });
                metaKeys.forEach(function (k) { dirtyMeta.add(k); });
                if (full) fullWrite = true;
                setSaveStatus({ cls: 'offline', text: 'Offline — backed up locally' });
                lastSaveErrorAt = Date.now();
                // Retry once after 5s
                setTimeout(function () {
                    if (Date.now() - lastSaveErrorAt < 4500) return; // user typed again
                    if (saveTimer || !hasUnsentEdits()) return; // a newer save is queued / nothing left
                    commitSave();
                }, 5000);
            });
        }
        // Save on tab close / blur as a safety net
        // (only when something is actually unsent; a clean tab must not rewrite
        // the packet on close).
        window.addEventListener('beforeunload', function () {
            if (hasUnsentEdits()) {
                clearTimeout(saveTimer);
                commitSave();
            }
        });

        // ─── Course profile (meta.profile) ───
        // A profile (CAP.COURSE_PROFILES) adds its modules, orders the tabs and
        // prints the PDF in its rubric's order. Applying never removes a
        // module; removing it changes nothing but meta.profile.
        const PROFILE_OFFER_TEXT = {
            nur311: 'Apply the Patient Care Assignment profile? It adds the Concept Map Essay (and Day 2 forms if missing) and prints the packet in rubric order with the rubric on the front. Nothing is deleted — you can remove the profile anytime.'
        };
        let offerFor = null; // id of the profile the banner is offering, or null

        // The profile to offer: none set yet, the offer not turned down, and
        // the Course (Patient Info or the packet's meta) matches its pattern.
        function offeredProfile() {
            if (!packet || !CAP.COURSE_PROFILES || currentProfile()) return null;
            if (packet.meta.profileOffer === 'dismissed') return null;
            const info = (packet.state && packet.state.info) || {};
            const course = [info.course, packet.meta.course].filter(function (s) { return s; }).join(' ');
            if (!course) return null;
            const ids = Object.keys(CAP.COURSE_PROFILES);
            for (let i = 0; i < ids.length; i++) {
                const P = CAP.COURSE_PROFILES[ids[i]];
                let re = null;
                try { re = P.offerMatch ? new RegExp(P.offerMatch, 'i') : null; } catch (e) { re = null; }
                if (re && re.test(String(course))) return P;
            }
            return null;
        }

        function renderOffer() {
            const slot = document.getElementById('capOfferSlot');
            if (!slot) return;
            const P = offeredProfile();
            const id = P ? P.id : null;
            if (id === offerFor) return; // unchanged — don't re-announce it
            offerFor = id;
            if (!P) { slot.innerHTML = ''; return; }
            slot.innerHTML =
                '<div class="cap-offer">' +
                    '<p class="cap-offer-text"><strong>This looks like ' + esc(P.code) + '.</strong> ' +
                        esc(PROFILE_OFFER_TEXT[P.id] ||
                            ('Apply the ' + P.label + ' profile? It prints the packet in the course\'s order. Nothing is deleted — you can remove the profile anytime.')) +
                    '</p>' +
                    '<div class="cap-offer-actions">' +
                        '<button type="button" class="cap-btn-sm primary" data-offer="apply">Apply profile</button>' +
                        '<button type="button" class="cap-btn-sm" data-offer="dismiss">Not now</button>' +
                    '</div>' +
                '</div>';
        }
        document.getElementById('capOfferSlot').addEventListener('click', function (ev) {
            const b = ev.target.closest('[data-offer]');
            if (!b || !packet || !offerFor) return;
            if (b.getAttribute('data-offer') === 'apply') {
                applyCourseProfile(offerFor);
            } else {
                packet.meta.profileOffer = 'dismissed';
                dirtyMeta.add('profileOffer');
                queueAutosave();
                renderOffer();
                showToast('You can apply the course profile later under ⚙️ Modules.', 'info');
            }
            // The banner is gone: keep keyboard focus somewhere sensible
            const t = document.querySelector('.cap-tab.active');
            if (t) t.focus();
        });

        // Re-render everything that depends on the profile
        function refreshForProfile() {
            setRendererContext();
            if (!activeTab || packet.meta.enabledModules.indexOf(activeTab) === -1) activeTab = orderedModules()[0] || null;
            renderTabs();
            renderActiveTab();
            renderOffer();
            if (document.getElementById('capDrawer').classList.contains('visible')) renderDrawer();
            refreshCheckUi(); // the Check button follows the profile
        }

        function applyCourseProfile(id) {
            const res = CAP.applyProfile ? CAP.applyProfile(packet.meta, id) : null;
            if (!res) { showToast('That course profile isn\'t available. Reload the page and try again.', 'error'); return; }
            const before = (packet.meta.enabledModules || []).slice();
            Object.assign(packet.meta, res);
            dirtyMeta.add('profile');
            dirtyMeta.add('enabledModules');
            queueAutosave();
            refreshForProfile();
            const P = CAP.COURSE_PROFILES[id];
            const added = packet.meta.enabledModules.filter(function (m) { return before.indexOf(m) === -1; })
                .map(function (m) { const c = CAP.MODULE_BY_ID[m]; return c ? (c.tabLabel || c.label) : m; });
            showToast(P.code + ' profile applied.' + (added.length ? ' Added: ' + added.join(', ') + '.' : '') +
                ' The PDF now prints in rubric order.', 'success');
        }

        function removeCourseProfile() {
            const prev = packet.meta.profile;
            if (!currentProfile()) return;
            packet.meta.profile = null;
            dirtyMeta.add('profile');
            // The offer has been answered — don't bring the banner back
            if (packet.meta.profileOffer !== 'dismissed') {
                packet.meta.profileOffer = 'dismissed';
                dirtyMeta.add('profileOffer');
            }
            queueAutosave();
            refreshForProfile();
            const undo = function () {
                if (!packet || packet.meta.profile) return;
                packet.meta.profile = prev;
                dirtyMeta.add('profile');
                queueAutosave();
                refreshForProfile();
            };
            if (window.showToastAction) {
                showToastAction({
                    title: 'Course profile removed',
                    message: 'Every module and all your data are still here. The PDF prints in the standard form order again.',
                    type: 'info',
                    actions: [{ label: 'Undo', onClick: undo }]
                });
            } else {
                showToast('Course profile removed. Your modules and data are unchanged.', 'info');
            }
        }

        // ─── Print modes (meta.printModes / meta.naReasons) ───
        // What the PDF does with a module or print-only page: Include, N/A
        // (+ reason) or Leave out. Never touches packet.state. Only overrides
        // are stored — a choice equal to the default (the profile's, else
        // Include) removes the key.
        const PRINT_MODE_LABEL = { include: 'Include', na: 'N/A', omit: 'Leave out' };
        function printModeOf(id, profile) {
            return CAP.printModeFor ? CAP.printModeFor(packet.meta, id, profile) : 'include';
        }
        function printDefaultOf(id, profile) {
            return CAP.printModeFor ? CAP.printModeFor(null, id, profile) : 'include';
        }
        // Editable copy of a meta map ({id: value})
        function metaMap(k) {
            const out = {};
            const v = packet.meta[k];
            if (v && typeof v === 'object') Object.keys(v).forEach(function (x) { out[x] = v[x]; });
            return out;
        }
        // Store a meta map whole (an empty one is removed); saved by the next autosave
        function putMetaMap(k, map) {
            if (Object.keys(map).length) packet.meta[k] = map; else delete packet.meta[k];
            dirtyMeta.add(k);
        }
        function setPrintMode(id, mode) {
            const pm = metaMap('printModes');
            if (mode === printDefaultOf(id, currentProfile())) delete pm[id]; else pm[id] = mode;
            putMetaMap('printModes', pm);
            queueAutosave();
        }
        function setNaReason(id, text) {
            const nr = metaMap('naReasons');
            const v = String(text == null ? '' : text).trim();
            if (v) nr[id] = v; else delete nr[id];
            putMetaMap('naReasons', nr);
            queueAutosave();
        }

        // "In PDF" select (+ N/A reason box) for one module or print page
        function printModeHtml(id, label, profile, isPage) {
            const cur = printModeOf(id, profile);
            const def = printDefaultOf(id, profile);
            const modes = isPage ? ['include', 'omit'] : ['include', 'na', 'omit'];
            const opts = modes.map(function (v) {
                return '<option value="' + v + '"' + (v === cur ? ' selected' : '') + '>' +
                    esc(PRINT_MODE_LABEL[v] + (profile && v === def ? ' (course default)' : '')) + '</option>';
            }).join('');
            return '<div class="cap-drawer-print">' +
                '<span class="cap-print-lbl" aria-hidden="true">In PDF</span>' +
                '<select class="cap-print-mode" data-print-id="' + esc(id) + '" data-mode="' + esc(cur) + '"' +
                    ' aria-label="In PDF: ' + esc(label) + '">' + opts + '</select>' +
                (isPage ? '' :
                    '<input type="text" class="cap-tf cap-print-reason" data-na-id="' + esc(id) + '" maxlength="160"' +
                    ' value="' + esc(CAP.naReasonFor ? CAP.naReasonFor(packet.meta, id) : '') + '"' +
                    ' placeholder="Why N/A? (prints in the PDF)" aria-label="Why N/A: ' + esc(label) + '"' +
                    (cur === 'na' ? '' : ' hidden') + '>') +
            '</div>';
        }

        function profileLineHtml(profile) {
            if (!CAP.COURSE_PROFILES) return '';
            if (profile) {
                return '<div class="cap-drawer-profile">' +
                    '<div class="cap-drawer-profile-text">Course profile: <strong>' + esc(profile.label) + '</strong></div>' +
                    '<p class="cap-drawer-profile-sub">Tabs and PDF follow the rubric\'s order. Removing the profile keeps every module and all your data.</p>' +
                    '<button type="button" class="cap-btn-sm" data-profile-remove="1">Remove profile</button>' +
                '</div>';
            }
            return '<div class="cap-drawer-profile">' +
                '<div class="cap-drawer-profile-text">Course profile: <strong>none</strong></div>' +
                Object.keys(CAP.COURSE_PROFILES).map(function (id) {
                    const P = CAP.COURSE_PROFILES[id];
                    return '<p class="cap-drawer-profile-sub">' + esc(P.label) +
                            ': adds the Concept Map Essay and puts the tabs and PDF in rubric order. Nothing is deleted.</p>' +
                        '<button type="button" class="cap-btn-sm" data-profile-apply="' + esc(id) + '">Apply ' + esc(P.code) + ' profile</button>';
                }).join('') +
            '</div>';
        }

        // ─── Module toggle drawer ───
        window.openModuleDrawer = function () {
            if (!packet) { showToast('Packet not loaded yet.', 'warning'); return; }
            if (checkDrawerOpen()) closeCheckDrawer(false); // one drawer at a time
            renderDrawer();
            document.getElementById('capDrawer').classList.add('visible');
            document.getElementById('capDrawerBackdrop').classList.add('visible');
        };
        window.closeModuleDrawer = function () {
            document.getElementById('capDrawer').classList.remove('visible');
            document.getElementById('capDrawerBackdrop').classList.remove('visible');
        };
        document.addEventListener('keydown', function (ev) {
            if (ev.key === 'Escape' && document.getElementById('capDrawer').classList.contains('visible')) {
                closeModuleDrawer();
            }
            if (ev.key === 'Escape' && checkDrawerOpen()) closeCheckDrawer();
        });

        // focusMod: module id whose checkbox gets focus back after the redraw
        function renderDrawer(focusMod) {
            const body = document.getElementById('capDrawerBody');
            const scrollTop = body.scrollTop;
            const enabled = new Set(packet.meta.enabledModules || []);
            const grouped = CAP.modulesByCategory();
            const profile = currentProfile();
            let html = profileLineHtml(profile);
            // The profile's print-only pages (rubric, divider): Include / Leave out
            if (profile && profile.pages && profile.pages.length) {
                html += '<div class="cap-drawer-cat">Extra pages</div>';
                profile.pages.forEach(function (pg) {
                    html += '<div class="cap-drawer-row cap-drawer-page">' +
                        '<div class="cap-drawer-toggle static">' +
                            '<span class="icon" aria-hidden="true">📄</span>' +
                            '<span class="label">' + esc(pg.label) + '</span>' +
                        '</div>' +
                        printModeHtml(pg.id, pg.label, profile, true) +
                    '</div>';
                });
            }
            CAP.CATEGORY_ORDER.forEach(function (cat) {
                const mods = grouped[cat];
                if (!mods || !mods.length) return;
                html += '<div class="cap-drawer-cat">' + esc(cat) + '</div>';
                mods.forEach(function (m) {
                    const isOn = enabled.has(m.id);
                    const locked = !!m.alwaysOn;
                    html += '<div class="cap-drawer-row' + (locked ? ' locked' : '') + '">' +
                        '<label class="cap-drawer-toggle">' +
                            '<input type="checkbox" data-mod="' + esc(m.id) + '" ' +
                                (isOn ? 'checked ' : '') + (locked ? 'disabled' : '') + '>' +
                            '<span class="icon">' + m.icon + '</span>' +
                            '<span class="label">' + esc(m.label) + '</span>' +
                            (locked ? '<span class="lock-tag">always on</span>' : '') +
                        '</label>' +
                        // Outside the <label>, so using it never toggles the module.
                        // Without a profile the standard cover always prints the
                        // Patient Info, so it has no "In PDF" choice.
                        (isOn && (profile || m.id !== 'info') ? printModeHtml(m.id, m.label, profile, false) : '') +
                    '</div>';
                });
            });
            body.innerHTML = html;
            body.scrollTop = scrollTop;
            // Wire toggles
            body.querySelectorAll('input[type="checkbox"][data-mod]').forEach(function (cb) {
                cb.addEventListener('change', function () { handleModuleToggle(cb); });
                if (focusMod && cb.dataset.mod === focusMod) cb.focus();
            });
        }

        // Print-mode selects, N/A reasons and the profile buttons (delegated:
        // the drawer body is redrawn often)
        (function () {
            const body = document.getElementById('capDrawerBody');
            body.addEventListener('change', function (ev) {
                const sel = ev.target.closest('select.cap-print-mode[data-print-id]');
                if (!sel || !packet) return;
                setPrintMode(sel.getAttribute('data-print-id'), sel.value);
                sel.setAttribute('data-mode', sel.value);
                const reason = sel.parentNode.querySelector('.cap-print-reason');
                if (reason) reason.hidden = sel.value !== 'na';
            });
            body.addEventListener('input', function (ev) {
                const inp = ev.target.closest('input.cap-print-reason[data-na-id]');
                if (!inp || !packet) return;
                setNaReason(inp.getAttribute('data-na-id'), inp.value);
            });
            body.addEventListener('click', function (ev) {
                const b = ev.target.closest('[data-profile-apply], [data-profile-remove]');
                if (!b || !packet) return;
                if (b.hasAttribute('data-profile-remove')) removeCourseProfile();
                else applyCourseProfile(b.getAttribute('data-profile-apply'));
                // The drawer was redrawn: put focus on the new profile button
                const nb = body.querySelector('[data-profile-apply], [data-profile-remove]');
                if (nb) nb.focus();
            });
        })();

        function handleModuleToggle(cb) {
            const modId = cb.dataset.mod;
            const m = CAP.MODULE_BY_ID[modId];
            if (!m) return;
            const enabled = new Set(packet.meta.enabledModules || []);
            const turningOn = cb.checked;
            if (turningOn) {
                enabled.add(modId);
                packet.meta.enabledModules = Array.from(enabled);
                if (activeTab === null || !packet.meta.enabledModules.includes(activeTab)) activeTab = modId;
                renderDrawer(modId); // shows the module's "In PDF" select
                renderTabs();
                renderActiveTab();
                dirtyMeta.add('enabledModules');
                queueAutosave();
                return;
            }
            // Turning OFF — confirm + wipe (per user decision: wipe with confirm).
            const hasData = packet.state && packet.state[modId] && Object.keys(packet.state[modId]).length > 0;
            const proceed = function () {
                enabled.delete(modId);
                packet.meta.enabledModules = Array.from(enabled);
                if (packet.state) delete packet.state[modId];
                // A clean section: its print-mode choice and N/A reason go too
                ['printModes', 'naReasons'].forEach(function (k) {
                    const map = metaMap(k);
                    if (Object.prototype.hasOwnProperty.call(map, modId)) {
                        delete map[modId];
                        putMetaMap(k, map);
                    }
                });
                if (activeTab === modId) activeTab = orderedModules()[0] || null;
                renderDrawer(modId);
                renderTabs();
                renderActiveTab();
                dirtyMeta.add('enabledModules');
                queueAutosave(modId); // writes state/<modId> = null (wipes it)
            };
            if (!hasData) { proceed(); return; }
            // Keep the box checked while the confirm is open. showConfirmModal has no
            // cancel hook, so Cancel/Esc must leave it checked; on confirm, proceed()
            // re-renders the drawer from packet state and the row comes back unchecked.
            cb.checked = true;
            if (window.showConfirmModal) {
                showConfirmModal('Hide ' + m.label + '?',
                    'This will delete the data you\'ve entered in this module. Continue? Tip: to keep the data but drop it from the PDF, use Leave out instead.',
                    proceed,
                    { danger: true, confirmText: 'Delete + hide' });
            } else if (confirm('Delete data in ' + m.label + '?')) {
                proceed();
            }
        }

        // ─── Pre-submit check (window.CAP_CHECK, course-profile packets) ───
        // A read-only completeness check against the profile's rubric and
        // the template: the Check button (with the must-fix count), the
        // Check drawer, and the export gate. Never writes to the packet.
        // Without a profile — or with a stale cached page that has no
        // CAP_CHECK — none of it shows and Export works as before.
        const CHECK_LABEL_FALLBACK = 'Completeness check against the rubric and template — not a grade.';
        const CHECK_STATUS = { complete: 'Complete', partial: 'Partial', missing: 'Missing', na: 'N/A' };
        const CHECK_GROUPS = [['block', 'Must fix'], ['warn', 'Should fix'], ['info', 'FYI']];
        let checkResult = null;      // last checkPacket() result (what the drawer shows)
        let checkTimer = null;       // debounce for re-runs after edits
        let checkGate = false;       // drawer opened by Export: banner + Export anyway
        let checkReturnFocus = null; // where focus goes when the drawer closes
        let checkTargets = [];       // Go to targets of the rendered drawer ([data-goto] index)

        function checkAvailable() {
            return !!(window.CAP_CHECK && typeof window.CAP_CHECK.checkPacket === 'function');
        }
        function checkOn() { return !!(packet && currentProfile() && checkAvailable()); }
        function checkDrawerOpen() { return document.getElementById('capCheckDrawer').classList.contains('visible'); }
        function runCheck() {
            try { return window.CAP_CHECK.checkPacket(packet, currentProfile(), {}); }
            catch (e) { console.warn('[CAP] check failed:', e); return null; }
        }
        function blockingOf(res) { return res && res.summary ? (res.summary.blocking || 0) : 0; }
        function itemsNeedText(n) { return n === 1 ? '1 item needs attention' : n + ' items need attention'; }

        // Button visibility + count; re-renders an open drawer. Runs on load,
        // when the profile is applied/removed and (debounced) after edits.
        function refreshCheckUi() {
            clearTimeout(checkTimer);
            checkTimer = null;
            document.getElementById('capCheckBtn').hidden = !checkOn();
            if (!checkOn()) {
                checkResult = null;
                updateCheckBadge();
                if (checkDrawerOpen()) closeCheckDrawer(false);
                return;
            }
            checkResult = runCheck();
            updateCheckBadge();
            if (checkDrawerOpen()) renderCheckDrawer();
        }
        function scheduleCheck() {
            if (!checkOn()) return;
            clearTimeout(checkTimer);
            checkTimer = setTimeout(refreshCheckUi, 600);
        }
        function updateCheckBadge() {
            const btn = document.getElementById('capCheckBtn');
            const badge = document.getElementById('capCheckBadge');
            const n = blockingOf(checkResult);
            badge.hidden = !(n > 0);
            badge.textContent = n > 0 ? String(n) : '';
            if (n > 0) {
                btn.setAttribute('aria-label', 'Check, ' + n + ' must-fix');
                btn.title = 'Pre-submit check: ' + itemsNeedText(n);
            } else {
                btn.removeAttribute('aria-label');
                btn.title = 'Pre-submit check against the rubric and template';
            }
        }

        // opts: { gate, returnFocus, result }
        window.openCheckDrawer = function (opts) {
            opts = opts || {};
            if (!packet) { showToast('Packet not loaded yet.', 'warning'); return; }
            if (!checkOn()) { showToast('The pre-submit check is for packets with a course profile.', 'info'); return; }
            if (document.getElementById('capDrawer').classList.contains('visible')) closeModuleDrawer();
            const drawer = document.getElementById('capCheckDrawer');
            const wasOpen = checkDrawerOpen();
            clearTimeout(checkTimer);
            checkTimer = null;
            checkResult = opts.result || runCheck();
            updateCheckBadge();
            checkGate = !!opts.gate;
            if (!wasOpen) {
                checkReturnFocus = opts.returnFocus || document.activeElement;
                document.getElementById('capCheckBody').scrollTop = 0;
            }
            renderCheckDrawer();
            drawer.classList.add('visible');
            document.getElementById('capCheckBackdrop').classList.add('visible');
            if (!wasOpen) drawer.focus();
        };
        // restoreFocus === false: the caller moves focus itself (Go to, Export anyway)
        window.closeCheckDrawer = function (restoreFocus) {
            const wasOpen = checkDrawerOpen();
            document.getElementById('capCheckDrawer').classList.remove('visible');
            document.getElementById('capCheckBackdrop').classList.remove('visible');
            checkGate = false;
            const back = checkReturnFocus;
            checkReturnFocus = null;
            if (wasOpen && restoreFocus !== false && back && document.contains(back) && !back.hidden) back.focus();
        };

        // Where a Go to button leads: the field's tab, or the Modules drawer
        // when the module is off (or set to N/A / Leave out and the note is
        // about that, i.e. has no field).
        function checkTargetKind(t) {
            if (!t || !t.tab || !CAP.MODULE_BY_ID[t.tab] || !/^[A-Za-z0-9_-]+$/.test(t.tab)) return '';
            if ((packet.meta.enabledModules || []).indexOf(t.tab) === -1) return 'modules';
            if (!t.sel && printModeOf(t.tab, currentProfile()) !== 'include') return 'modules';
            return 'tab';
        }
        function checkGotoHtml(t, context, asLink) {
            const kind = checkTargetKind(t);
            if (!kind) return '';
            const i = checkTargets.push({ tab: t.tab, sel: t.sel || '' }) - 1;
            const label = kind === 'modules' ? 'Open Modules' : 'Go to';
            const ctx = String(context || '').replace(/\s+/g, ' ').trim();
            const aria = label + (ctx ? ': ' + (ctx.length > 90 ? ctx.slice(0, 89) + '…' : ctx) : '');
            return '<button type="button" class="' + (asLink ? 'cap-link-btn' : 'cap-btn-sm') + '" data-goto="' + i + '"' +
                ' aria-label="' + esc(aria) + '">' + label + '</button>';
        }

        function checkSummaryText(res) {
            if (!res) return 'The check couldn\'t run on this packet.';
            const s = res.summary || {};
            const rows = (res.rows || []).length;
            const n = blockingOf(res);
            return (s.complete || 0) + ' of ' + rows + ' rubric rows complete' +
                (s.na ? ' · ' + s.na + ' N/A' : '') +
                ' · ' + (n ? n + ' must-fix' : 'no must-fix items');
        }

        function checkRowsHtml(res) {
            const rows = res.rows || [];
            if (!rows.length) return '';
            return '<h4 class="cap-drawer-cat cap-check-h">Rubric · ' + rows.length + ' rows</h4>' +
                '<ol class="cap-check-rows">' + rows.map(function (r) {
                    const status = CHECK_STATUS[r.status] ? r.status : 'missing';
                    const notes = Array.isArray(r.notes) ? r.notes : [];
                    return '<li class="cap-check-row" data-row-id="' + esc(r.id) + '" data-status="' + esc(status) + '">' +
                        '<div class="cap-check-rowhead">' +
                            '<span class="cap-check-n"><span class="cap-sr">Row </span>' + esc(r.n) + '</span>' +
                            '<span class="cap-check-rowlabel">' + esc(r.label) + '</span>' +
                            (r.points != null && r.points !== '' ? '<span class="cap-check-pts">' + esc(r.points) + ' pts</span>' : '') +
                            '<span class="cap-check-pill" data-status="' + esc(status) + '">' + esc(CHECK_STATUS[status]) + '</span>' +
                        '</div>' +
                        (notes.length ? '<ul class="cap-check-notes">' + notes.map(function (n) {
                            return '<li>' + esc(n.text) + checkGotoHtml(n, n.text, true) + '</li>';
                        }).join('') + '</ul>' : '') +
                    '</li>';
                }).join('') + '</ol>';
        }

        // Must fix = missing rubric rows + 'block' issues (summary.blocking);
        // Should fix = 'warn'; FYI = 'info'.
        function checkIssuesHtml(res) {
            const items = { block: [], warn: [], info: [] };
            (res.issues || []).forEach(function (x) {
                if (items[x.severity]) items[x.severity].push(x);
            });
            const missing = (res.rows || []).filter(function (r) { return r.status === 'missing'; });
            let html = '';
            let any = false;
            CHECK_GROUPS.forEach(function (g) {
                const sev = g[0];
                const list = items[sev];
                const count = list.length + (sev === 'block' ? missing.length : 0);
                if (!count) return;
                any = true;
                html += '<h4 class="cap-drawer-cat cap-check-h"' + (sev === 'block' ? ' id="capCheckMustFix" tabindex="-1"' : '') + '>' +
                    esc(g[1]) + ' · ' + count + '</h4><ul class="cap-check-issues">';
                list.forEach(function (x) {
                    html += '<li class="cap-check-issue" data-sev="' + sev + '" data-code="' + esc(x.code) + '">' +
                        '<div class="cap-check-ibody">' +
                            '<p class="cap-check-itext">' + esc(x.text) + '</p>' +
                            (x.excerpt ? '<p class="cap-check-excerpt">“' + esc(x.excerpt) + '”</p>' : '') +
                        '</div>' +
                        checkGotoHtml(x, x.text, false) +
                    '</li>';
                });
                if (sev === 'block') {
                    missing.forEach(function (r) {
                        const first = (Array.isArray(r.notes) && r.notes[0]) || null;
                        const head = 'Missing: ' + r.label + (r.points != null && r.points !== '' ? ' (' + r.points + ' pts)' : '');
                        html += '<li class="cap-check-issue" data-sev="block" data-code="row-missing" data-row-id="' + esc(r.id) + '">' +
                            '<div class="cap-check-ibody">' +
                                '<p class="cap-check-itext">' + esc(head) + '</p>' +
                                (first && first.text ? '<p class="cap-check-isub">' + esc(first.text) + '</p>' : '') +
                            '</div>' +
                            (first ? checkGotoHtml(first, head, false) : '') +
                        '</li>';
                    });
                }
                html += '</ul>';
            });
            if (!any) html = '<h4 class="cap-drawer-cat cap-check-h">Issues</h4><p class="cap-check-empty">Nothing flagged.</p>';
            return html;
        }

        function renderCheckDrawer() {
            const res = checkResult;
            const body = document.getElementById('capCheckBody');
            const drawer = document.getElementById('capCheckDrawer');
            const scrollTop = body.scrollTop;
            const ae = document.activeElement;
            const focusKey = ae && body.contains(ae) ? ae.getAttribute('data-goto') : null;
            const n = blockingOf(res);
            const gating = checkGate && n > 0;
            // Gate banner (Export with blocking items)
            const gate = document.getElementById('capCheckGate');
            if (gating) {
                const html = '<strong>' + esc(itemsNeedText(n)) + ' before you submit.</strong>' +
                    '<p>Review <button type="button" class="cap-link-btn" data-check-jump="1">Must fix</button>, or use Export anyway.</p>';
                if (gate.innerHTML !== html) gate.innerHTML = html;
                gate.hidden = false;
            } else {
                gate.hidden = true;
                gate.innerHTML = '';
            }
            const lbl = (window.CAP_CHECK && window.CAP_CHECK.LABEL) || CHECK_LABEL_FALLBACK;
            const lblEl = document.getElementById('capCheckLabel');
            if (lblEl.textContent !== lbl) lblEl.textContent = lbl;
            document.getElementById('capCheckExport').textContent = gating ? 'Export anyway' : '📄 Export PDF';
            // Only touch the live region when the line changes
            const sumEl = document.getElementById('capCheckSummary');
            const sum = checkSummaryText(res);
            if (sumEl.textContent !== sum) sumEl.textContent = sum;
            checkTargets = [];
            body.innerHTML = res
                ? checkRowsHtml(res) + checkIssuesHtml(res)
                : '<p class="cap-check-empty">Reload the page and try again.</p>';
            body.scrollTop = scrollTop;
            if (focusKey !== null) {
                const b = body.querySelector('[data-goto="' + focusKey + '"]');
                if (b) b.focus(); else drawer.focus();
            }
        }

        // Switch to the field's tab and focus it (closed <details> around it
        // are opened). No selector, or no such field: the tab itself.
        function checkGoTo(t) {
            const kind = checkTargetKind(t);
            closeCheckDrawer(false);
            if (!kind) return;
            if (kind === 'modules') {
                window.openModuleDrawer();
                const body = document.getElementById('capDrawerBody');
                const el = body.querySelector('select.cap-print-mode[data-print-id="' + t.tab + '"]') ||
                    body.querySelector('input[type="checkbox"][data-mod="' + t.tab + '"]');
                if (el) {
                    const row = el.closest('.cap-drawer-row') || el;
                    row.scrollIntoView({ block: 'center' });
                    el.focus({ preventScroll: true });
                }
                return;
            }
            if (activeTab !== t.tab) window.switchTab(t.tab);
            const tabBtn = document.querySelector('.cap-tab.active');
            if (tabBtn) {
                // Bring the tab into view in a scrolled tab bar
                const bar = tabBtn.parentNode, r = tabBtn.getBoundingClientRect(), br = bar.getBoundingClientRect();
                if (r.left < br.left || r.right > br.right) bar.scrollLeft += r.left - br.left - 16;
            }
            requestAnimationFrame(function () {
                const content = document.getElementById('capContent');
                let el = null;
                if (t.sel) { try { el = content.querySelector(t.sel); } catch (e) { el = null; } }
                if (el) {
                    for (let d = el.closest('details'); d; d = d.parentElement && d.parentElement.closest('details')) d.open = true;
                }
                if (el && el.getClientRects().length && !el.disabled) {
                    el.scrollIntoView({ block: 'center' });
                    el.focus({ preventScroll: true });
                    return;
                }
                window.scrollTo(0, 0);
                if (tabBtn) tabBtn.focus({ preventScroll: true });
            });
        }

        (function () {
            const drawer = document.getElementById('capCheckDrawer');
            const body = document.getElementById('capCheckBody');
            body.addEventListener('click', function (ev) {
                const b = ev.target.closest('[data-goto]');
                if (!b || !packet) return;
                const t = checkTargets[parseInt(b.getAttribute('data-goto'), 10)];
                if (t) checkGoTo(t);
            });
            document.getElementById('capCheckGate').addEventListener('click', function (ev) {
                if (!ev.target.closest('[data-check-jump]')) return;
                const h = document.getElementById('capCheckMustFix');
                if (h) { h.scrollIntoView({ block: 'start' }); h.focus({ preventScroll: true }); }
            });
            // Footer: Export anyway (gate) forces the export; Export PDF goes
            // through the normal path, which gates if anything must be fixed.
            document.getElementById('capCheckExport').addEventListener('click', function () {
                if (!packet) return;
                const headBtn = document.getElementById('capExportPdfBtn');
                if (!(checkGate && blockingOf(checkResult) > 0) && gateExport(headBtn)) return;
                closeCheckDrawer(false);
                headBtn.focus();
                window.exportPacketPdf(headBtn, true);
            });
            // Keep Tab inside the open dialog
            drawer.addEventListener('keydown', function (ev) {
                if (ev.key !== 'Tab') return;
                const f = Array.from(drawer.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'))
                    .filter(function (e) { return !e.disabled && e.getClientRects().length > 0; });
                if (!f.length) return;
                const first = f[0], last = f[f.length - 1];
                if (ev.shiftKey && (document.activeElement === first || document.activeElement === drawer)) {
                    ev.preventDefault(); last.focus();
                } else if (!ev.shiftKey && document.activeElement === last) {
                    ev.preventDefault(); first.focus();
                }
            });
        })();

        // Export gate: a profile packet with must-fix items opens the drawer
        // instead of exporting. true = gated (the caller stops).
        function gateExport(btnEl) {
            if (!checkOn()) return false;
            const res = runCheck();
            if (!(blockingOf(res) > 0)) return false;
            window.openCheckDrawer({ gate: true, returnFocus: btnEl, result: res });
            return true;
        }

        // ─── PDF export ───
        // jsPDF is lazy-loaded (large library, only fetched when student
        // clicks Export). Once loaded, hand off to CAP_PDF.generate(packet).
        let _jsPdfLoaded = false;
        function loadJsPdf() {
            if (_jsPdfLoaded) return Promise.resolve();
            return new Promise(function (resolve, reject) {
                const s = document.createElement('script');
                s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
                s.onload = function () { _jsPdfLoaded = true; resolve(); };
                s.onerror = function () { reject(new Error('Failed to load jsPDF')); };
                document.head.appendChild(s);
            });
        }
        // force === true skips the pre-submit gate (Export anyway).
        window.exportPacketPdf = function (btnEl, force) {
            if (!packet) { showToast('Packet not loaded yet.', 'warning'); return; }
            // Course-profile packets with must-fix items open the Check drawer
            // first; plain packets (and a missing CAP_CHECK) export as before.
            if (force !== true && gateExport(btnEl)) return;
            const orig = btnEl.textContent;
            // Disabling the focused button drops focus to <body>; put it back after
            const hadFocus = document.activeElement === btnEl;
            btnEl.disabled = true;
            btnEl.textContent = '⏳ Generating…';
            // Make sure any pending edits are flushed before exporting
            if (hasUnsentEdits()) { clearTimeout(saveTimer); commitSave(); }
            loadJsPdf().then(function () {
                if (!window.CAP_PDF) throw new Error('CAP_PDF module not loaded');
                window.CAP_PDF.generate(packet);
                showToast('PDF generated.', 'success');
            }).catch(function (err) {
                console.error('[CAP] PDF export failed:', err);
                showToast('PDF export failed: ' + (err.message || err), 'error');
            }).then(function () {
                btnEl.disabled = false;
                btnEl.textContent = orig;
                if (hadFocus && (!document.activeElement || document.activeElement === document.body)) btnEl.focus({ preventScroll: true });
            });
        };
    </script>
</body>
</html>
